<!doctype html>
<html lang="es" data-tema="oscuro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Motion Playground</title>
<meta name="description" content="Cada módulo del motor, corriendo, con su código a la vista.">
<style>
:root{
  --base:#121311; --sup:#1A1B18; --linea:#2C2E29; --linea2:#3D4039;
  --tx:#EFEDE6; --tx2:#BAB5A9; --tx3:#8B857A;
  --ac:#F0774A; --ac2:#4FC7BE;
  --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:8px;
}
:root[data-tema="claro"]{
  --base:#F3F1EC; --sup:#FBFAF7; --linea:#DDD9D0; --linea2:#C6C1B5;
  --tx:#191712; --tx2:#57524A; --tx3:#736D60;
  --ac:#BE3E19; --ac2:#0C6E6A;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--base);color:var(--tx);font-family:var(--sans);
  font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:inherit}
.barra{position:fixed;inset:0 0 auto 0;z-index:60;display:flex;align-items:center;gap:14px;
  height:52px;padding:0 18px;background:color-mix(in srgb,var(--base) 88%,transparent);
  backdrop-filter:blur(12px);border-bottom:1px solid var(--linea)}
.barra b{font-weight:700;letter-spacing:-.01em;white-space:nowrap}
.barra b i{color:var(--ac);font-style:normal}
.barra nav{display:flex;gap:2px;overflow-x:auto;flex:1;scrollbar-width:none}
.barra nav::-webkit-scrollbar{display:none}
.barra nav a{font-family:var(--mono);font-size:12px;color:var(--tx3);text-decoration:none;
  padding:5px 9px;border-radius:5px;white-space:nowrap}
.barra nav a:hover,.barra nav a.on{color:var(--tx);background:var(--sup)}
.barra button{font:500 12px/1 var(--mono);background:var(--sup);color:var(--tx2);
  border:1px solid var(--linea2);border-radius:5px;padding:7px 11px;cursor:pointer;white-space:nowrap}
.barra button:hover{color:var(--tx);border-color:var(--ac)}
.barra button[aria-pressed="true"]{color:var(--ac);border-color:var(--ac)}
main{padding-top:52px}
section{border-bottom:1px solid var(--linea);padding:72px clamp(18px,5vw,64px) 84px;scroll-margin-top:52px;
  max-width:1280px;margin:0 auto}
.ojo{font-family:var(--mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--ac);margin:0 0 12px}
h1{font-size:clamp(2.4rem,1.8rem+2.6vw,4rem);line-height:1.02;letter-spacing:-.03em;margin:0 0 18px;font-weight:800}
h2{font-size:clamp(1.6rem,1.35rem+1.1vw,2.3rem);line-height:1.12;letter-spacing:-.02em;margin:0 0 10px;font-weight:700}
h3{font-size:1rem;margin:0 0 6px;font-weight:650}
p{margin:0 0 16px;max-width:66ch;color:var(--tx2)}
p.lede{font-size:1.12rem;color:var(--tx2);max-width:60ch}
.rej{display:grid;gap:16px;margin:22px 0}
.r2{grid-template-columns:repeat(2,1fr)}
.r3{grid-template-columns:repeat(3,1fr)}
.r4{grid-template-columns:repeat(4,1fr)}
@media(max-width:820px){.r3,.r4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:560px){.rej{grid-template-columns:1fr!important}}
.tj{background:var(--sup);border:1px solid var(--linea);border-radius:var(--r);padding:18px 20px}
.demo{position:relative;background:var(--sup);border:1px solid var(--linea);border-radius:var(--r);
  padding:26px;min-height:150px;overflow:hidden}
.demo.alto{min-height:280px}
pre{margin:12px 0 0;background:var(--base);border:1px solid var(--linea);border-radius:6px;
  padding:13px 15px;overflow:auto;font-family:var(--mono);font-size:12.5px;line-height:1.6;color:var(--tx2)}
pre b{color:var(--ac2);font-weight:500}
.caja{width:64px;height:64px;border-radius:10px;background:var(--ac);display:grid;place-items:center;
  font-family:var(--mono);font-size:12px;color:#fff}
.fila{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.btn{font:500 13px/1 var(--sans);background:var(--base);color:var(--tx);border:1px solid var(--linea2);
  border-radius:6px;padding:10px 15px;cursor:pointer}
.btn:hover{border-color:var(--ac)}
.btn:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.pill{font-family:var(--mono);font-size:11px;color:var(--tx3);border:1px solid var(--linea2);
  border-radius:999px;padding:3px 9px}
.tarjeta{background:var(--base);border:1px solid var(--linea2);border-radius:var(--r);padding:18px;
  min-height:110px}
.marco{width:100%;aspect-ratio:16/10;border-radius:var(--r);overflow:hidden;position:relative;
  background:linear-gradient(135deg,var(--ac),var(--ac2))}
.marco span{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--mono);
  font-size:12px;color:#fff;mix-blend-mode:difference}
.rejilla-demo{display:flex;gap:8px;flex-wrap:wrap}
.rejilla-demo div{width:52px;height:52px;border-radius:7px;background:var(--ac2)}
.foco{position:relative;isolation:isolate}
.foco::after{content:"";position:absolute;inset:0;border-radius:var(--r);pointer-events:none;
  background:radial-gradient(240px circle at var(--mx,50%) var(--my,50%),
    color-mix(in srgb,var(--ac) 30%,transparent),transparent 65%);
  opacity:var(--cerca,0);transition:opacity .2s}
.nota{font-family:var(--mono);font-size:12px;color:var(--tx3);margin-top:10px}
.meta{height:8px;border-radius:4px;background:var(--linea);overflow:hidden;margin-top:10px}
.meta i{display:block;height:100%;background:var(--ac2);width:0}
footer{padding:48px clamp(18px,5vw,64px) 90px;max-width:1280px;margin:0 auto;color:var(--tx3);
  font-family:var(--mono);font-size:12.5px}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style>
</head>
<body>
<div class="barra">
  <b>Motion<i>.</i></b>
  <nav id="nav"></nav>
  <button id="reduce" aria-pressed="false" title="Simula prefers-reduced-motion">movimiento</button>
  <button id="dbg" aria-pressed="false">debug</button>
  <button id="tema">tema</button>
</div>
<main id="main"></main>
<footer>
  Todo lo de esta página corre sobre un solo requestAnimationFrame.
  Activa <b>debug</b> para ver el coste por frame, cuántas animaciones hay vivas y qué bucles no terminan nunca.
</footer>

<script>// ============================================================================
// The playground.
//
// Each section declares its markup and the exact call that drives it, and the
// same string is both executed and printed — so the code on screen cannot
// drift from the code running, which is the usual failure of a demo page.
// ============================================================================
(() => {
  const m = window.motion;
  const main = document.getElementById("main");
  const nav = document.getElementById("nav");

  /** A section: markup, the call, and the montage that runs it. */
  const SECCIONES = [
    {
      id: "inicio",
      titulo: "Un motor de motion graphics para la web",
      ojo: "Motion Playground",
      lede: "Un núcleo, un reloj, un juego de tokens, y módulos que son capas finas sobre ellos. " +
            "Cero dependencias en runtime. Todo lo de abajo corre aquí mismo, ahora.",
      html: `
        <div class="rej r4">
          <div class="tj"><h3 id="k-fps">—</h3><p style="margin:0;font-size:13px">fps</p></div>
          <div class="tj"><h3 id="k-frame">—</h3><p style="margin:0;font-size:13px">coste por frame</p></div>
          <div class="tj"><h3 id="k-anim">—</h3><p style="margin:0;font-size:13px">animaciones vivas</p></div>
          <div class="tj"><h3 id="k-pol">—</h3><p style="margin:0;font-size:13px">política de movimiento</p></div>
        </div>`,
      montar() {
        setInterval(() => {
          const i = m.report();
          document.getElementById("k-fps").textContent = i.fps || "—";
          document.getElementById("k-frame").textContent = i.costoFrame.toFixed(1) + " ms";
          document.getElementById("k-anim").textContent = i.animaciones;
          document.getElementById("k-pol").textContent = i.politica;
        }, 250);
      },
    },

    {
      id: "entrada",
      titulo: "Entrada",
      ojo: "Animaciones de entrada",
      lede: "Doce presets de entrada, escalonado en cinco orígenes, y una regla: el contenido es " +
            "visible aunque este script nunca corra.",
      html: `
        <div class="demo">
          <div class="rejilla-demo" id="d-entrada">${"<div></div>".repeat(10)}</div>
          <div class="fila" style="margin-top:18px">
            <button class="btn" data-e="slideUp">slideUp</button>
            <button class="btn" data-e="pop">pop</button>
            <button class="btn" data-e="blurIn">blurIn</button>
            <button class="btn" data-e="scaleIn">scaleIn</button>
          </div>
          <div class="fila" style="margin-top:8px">
            <span class="pill">desde</span>
            <button class="btn" data-d="inicio">inicio</button>
            <button class="btn" data-d="centro">centro</button>
            <button class="btn" data-d="bordes">bordes</button>
            <button class="btn" data-d="azar">azar</button>
          </div>
        </div>`,
      codigo: `motion.preset("slideUp", "#d-entrada div", {
  escalonado: { paso: 55, desde: "centro" }
})`,
      montar(raiz) {
        const els = raiz.querySelectorAll("#d-entrada div");
        let desde = "inicio";
        const correr = (preset) => m.preset(preset, els, { escalonado: { paso: 55, desde } });
        raiz.querySelectorAll("[data-e]").forEach((b) => (b.onclick = () => correr(b.dataset.e)));
        raiz.querySelectorAll("[data-d]").forEach((b) => (b.onclick = () => { desde = b.dataset.d; correr("slideUp"); }));
        correr("slideUp");
      },
    },

    {
      id: "fisica",
      titulo: "Física",
      ojo: "Muelles e inercia",
      lede: "Un muelle no tiene duración: corre hasta asentarse, y dónde acaba depende de a qué " +
            "velocidad venía. Arrastra la caja y suéltala.",
      html: `
        <div class="demo alto" id="d-fisica" style="cursor:grab">
          <div class="caja" id="d-muelle" style="position:absolute;left:40px;top:90px;cursor:grab">arrastra</div>
          <div class="fila" style="position:absolute;left:26px;bottom:22px">
            <button class="btn" data-m="blando">blando</button>
            <button class="btn" data-m="medio">medio</button>
            <button class="btn" data-m="firme">firme</button>
            <button class="btn" data-m="elastico">elástico</button>
          </div>
        </div>`,
      codigo: `motion.spring(caja, { x: 0, y: 0, muelle: "elastico" })`,
      montar(raiz) {
        const caja = raiz.querySelector("#d-muelle");
        let muelle = "medio";
        raiz.querySelectorAll("[data-m]").forEach((b) => (b.onclick = () => { muelle = b.dataset.m; volver(); }));

        let arrastrando = false, ox = 0, oy = 0, x = 0, y = 0;
        const volver = () => m.spring(caja, { x: 0, y: 0, muelle });
        caja.addEventListener("pointerdown", (e) => {
          arrastrando = true; ox = e.clientX - x; oy = e.clientY - y;
          caja.setPointerCapture(e.pointerId); caja.style.cursor = "grabbing";
          m.stop(caja);
        });
        addEventListener("pointermove", (e) => {
          if (!arrastrando) return;
          x = e.clientX - ox; y = e.clientY - oy;
          caja.style.transform = `translate3d(${x}px,${y}px,0)`;
        });
        addEventListener("pointerup", () => {
          if (!arrastrando) return;
          arrastrando = false; caja.style.cursor = "grab";
          x = 0; y = 0; volver();
        });
      },
    },

    {
      id: "scroll",
      titulo: "Scroll",
      ojo: "Animación ligada al scroll",
      lede: "El progreso se recalcula desde la geometría en cada frame, nunca se integra: bajar y " +
            "volver a subir devuelve exactamente el mismo valor.",
      html: `
        <div class="rej r2">
          <div class="demo alto" id="d-scroll">
            <div class="caja" id="d-parallax" style="margin:0 auto">parallax</div>
            <div class="meta"><i id="d-meta"></i></div>
            <p class="nota" id="d-prog">progreso 0%</p>
          </div>
          <div class="demo alto foco" id="d-scroll2">
            <p class="nota">velocidad y dirección del scroll, medidas una vez por frame para toda la página</p>
            <h3 id="d-vel" style="font-family:var(--mono);font-size:26px">0 px/s</h3>
          </div>
        </div>`,
      codigo: `motion.scroll("#d-parallax", {
  rango: "cubre", scrub: true,
  y: [40, -40], rotate: [-6, 6],
  alProgresar: (p) => meta.style.width = (p * 100) + "%"
})`,
      montar(raiz) {
        const meta = raiz.querySelector("#d-meta");
        const prog = raiz.querySelector("#d-prog");
        m.scroll(raiz.querySelector("#d-parallax"), {
          rango: "cubre", scrub: true, y: [40, -40], rotate: [-6, 6],
          alProgresar: (p) => {
            meta.style.width = (p * 100).toFixed(1) + "%";
            prog.textContent = "progreso " + (p * 100).toFixed(0) + "%";
          },
        });
        const vel = raiz.querySelector("#d-vel");
        m.onScroll((e) => { vel.textContent = Math.round(e.velocidad) + " px/s"; });
        m.spotlight("#d-scroll2");
      },
    },

    {
      id: "hover",
      titulo: "Hover y puntero",
      ojo: "Interacción",
      lede: "Todo hover responde también al foco de teclado, y nada de esto se monta en un puntero " +
            "grueso: un hover pegado tras el primer toque es peor que ninguno.",
      html: `
        <div class="rej r4">
          <button class="btn tarjeta" id="d-lift">levantar</button>
          <button class="btn tarjeta" id="d-tilt">inclinar</button>
          <button class="btn tarjeta" id="d-mag">magnético</button>
          <div class="tarjeta foco" id="d-spot">spotlight<br><span class="nota">dos variables CSS</span></div>
        </div>`,
      codigo: `motion.lift("#d-lift", { altura: 8 })
motion.tilt("#d-tilt", { grados: 12, elevacion: 20 })
motion.magnetic("#d-mag", { radio: 140, fuerza: 0.4 })
motion.spotlight("#d-spot")   <b>// escribe --mx, --my y --cerca</b>`,
      montar(raiz) {
        m.lift(raiz.querySelector("#d-lift"), { altura: 8 });
        m.tilt(raiz.querySelector("#d-tilt"), { grados: 12, elevacion: 20 });
        m.magnetic(raiz.querySelector("#d-mag"), { radio: 140, fuerza: 0.4 });
        m.spotlight(raiz.querySelector("#d-spot"));
      },
    },

    {
      id: "cursor",
      titulo: "Cursor",
      ojo: "Cursor personalizado",
      lede: "Estados declarados con data-cursor, no manejadores sueltos. Nada de esto es interactivo: " +
            "aria-hidden, sin eventos, sin foco. Y no existe en táctil ni con movimiento reducido.",
      html: `
        <div class="demo">
          <div class="fila">
            <a class="btn" href="#cursor" data-cursor="enlace">enlace</a>
            <span class="btn" data-cursor="imagen">imagen</span>
            <span class="btn" data-cursor="arrastrar">arrastrar</span>
            <input class="btn" data-cursor="texto" placeholder="texto" style="width:140px">
            <button class="btn" id="d-cursor-on" aria-pressed="false">activar</button>
          </div>
          <p class="nota" id="d-cursor-est">apagado</p>
        </div>`,
      codigo: `const c = motion.cursor({ anillo: true, seguimiento: 1 })
<b>// &lt;a data-cursor="enlace"&gt; · &lt;img data-cursor="imagen"&gt;</b>
c.fijar("cargando")   <b>// forzar un estado</b>`,
      montar(raiz) {
        let c = null;
        const btn = raiz.querySelector("#d-cursor-on");
        const est = raiz.querySelector("#d-cursor-est");
        btn.onclick = () => {
          if (c) { c.destruir(); c = null; btn.setAttribute("aria-pressed", "false"); est.textContent = "apagado"; return; }
          c = m.cursor({ anillo: true });
          btn.setAttribute("aria-pressed", String(!!c));
          est.textContent = c ? "activo — mueve el ratón sobre los botones" : "no disponible en este dispositivo";
        };
        setInterval(() => { if (c) est.textContent = "estado: " + c.estado(); }, 200);
      },
    },

    {
      id: "texto",
      titulo: "Texto",
      ojo: "Tipografía cinética",
      lede: "La división por caracteres, palabras o líneas conserva la frase como aria-label y oculta " +
            "cada fragmento: un lector de pantalla sigue leyendo una oración, no letras sueltas.",
      html: `
        <div class="demo">
          <h2 id="d-texto" style="max-width:20ch">Quién decide quién entra</h2>
          <p class="nota" id="d-aria"></p>
          <div class="fila" style="margin-top:14px">
            <button class="btn" data-t="palabras">palabras</button>
            <button class="btn" data-t="caracteres">caracteres</button>
            <button class="btn" data-t="lineas">líneas</button>
            <button class="btn" data-t="scramble">scramble</button>
            <button class="btn" data-t="maquina">máquina</button>
          </div>
          <h2 id="d-cifra" style="font-family:var(--mono);margin-top:22px">312</h2>
          <button class="btn" id="d-contar">contar</button>
        </div>`,
      codigo: `motion.text("#titulo", { split: "palabras", animacion: "fade-up", escalonado: 0.05 })
motion.scramble("#titulo")
motion.countUp("#cifra")   <b>// respeta prefijo, sufijo, decimales y separador</b>`,
      montar(raiz) {
        const h = raiz.querySelector("#d-texto");
        const original = h.textContent;
        const aria = raiz.querySelector("#d-aria");
        const refrescar = () => { aria.textContent = 'aria-label: "' + (h.getAttribute("aria-label") || "—") + '"'; };
        raiz.querySelectorAll("[data-t]").forEach((b) => (b.onclick = () => {
          h.textContent = original;
          h.removeAttribute("aria-label");
          const t = b.dataset.t;
          if (t === "scramble") m.scramble(h);
          else if (t === "maquina") m.typewriter(h, { velocidad: 22 });
          else m.text(h, { corte: t, animacion: "fade-up", escalonado: t === "caracteres" ? 22 : 45 });
          setTimeout(refrescar, 30);
        }));
        raiz.querySelector("#d-contar").onclick = () => m.countUp(raiz.querySelector("#d-cifra"));
        refrescar();
      },
    },

    {
      id: "layout",
      titulo: "Layout",
      ojo: "FLIP y elemento compartido",
      lede: "El navegador no puede interpolar un cambio de layout. FLIP mide antes y después y anima " +
            "la diferencia como transform, así que nada vuelve a maquetarse mientras se mueve.",
      html: `
        <div class="demo">
          <div class="rejilla-demo" id="d-flip">${"<div></div>".repeat(9)}</div>
          <div class="fila" style="margin-top:16px">
            <button class="btn" id="d-baraja">barajar</button>
            <button class="btn" id="d-quitar">quitar uno</button>
          </div>
        </div>`,
      codigo: `motion.reorder("#d-flip div", () => {
  <b>// cualquier mutación del DOM: ordenar, filtrar, insertar</b>
  rejilla.append(...[...rejilla.children].sort(() =&gt; Math.random() - .5))
})`,
      montar(raiz) {
        const rejilla = raiz.querySelector("#d-flip");
        raiz.querySelector("#d-baraja").onclick = () =>
          m.reorder("#d-flip div", () => {
            rejilla.append(...[...rejilla.children].sort(() => Math.random() - 0.5));
          });
        raiz.querySelector("#d-quitar").onclick = () =>
          m.reorder("#d-flip div", () => {
            if (rejilla.children.length > 2) rejilla.children[0].remove();
          });
      },
    },

    {
      id: "imagen",
      titulo: "Imagen",
      ojo: "Revelado y parallax",
      lede: "El marco se recorta y la imagen contra-escala: parece que se descubre, no que crece. " +
            "Y nada arranca antes de que la imagen esté decodificada.",
      html: `
        <div class="rej r3">
          <div class="marco" id="d-img1"><span>mask-up</span></div>
          <div class="marco" id="d-img2"><span>ken burns</span></div>
          <div class="marco" id="d-img3"><span>inclinar</span></div>
        </div>
        <button class="btn" id="d-img-run">revelar</button>`,
      codigo: `motion.imageReveal("#marco", { tipo: "mask-up" })
motion.kenBurns("#marco img", { escala: 1.14 })
motion.tilt("#marco", { grados: 10 })`,
      montar(raiz) {
        const correr = () => {
          m.animate(raiz.querySelector("#d-img1"), { clipPath: ["inset(100% 0 0 0)", "inset(0 0 0 0)"], duracion: 800 });
          m.kenBurns(raiz.querySelector("#d-img2"), { escala: 1.18, duracion: 4000 });
        };
        m.tilt(raiz.querySelector("#d-img3"), { grados: 10, elevacion: 14 });
        raiz.querySelector("#d-img-run").onclick = correr;
        correr();
      },
    },

    {
      id: "particulas",
      titulo: "Partículas",
      ojo: "Canvas 2D",
      lede: "Pool fijo sobre typed arrays: las partículas se reciclan, nunca se crean ni se destruyen " +
            "durante la animación. Un GC a media animación es un frame perdido que no se puede depurar.",
      html: `
        <div class="demo alto" id="d-part" style="position:relative">
          <div class="fila" style="position:relative;z-index:1">
            <button class="btn" data-p="chispas">chispas</button>
            <button class="btn" data-p="nieve">nieve</button>
            <button class="btn" data-p="campo">campo con turbulencia</button>
            <button class="btn" data-p="off">apagar</button>
          </div>
          <p class="nota" id="d-part-n" style="position:relative;z-index:1">—</p>
        </div>`,
      codigo: `motion.particles({
  host: "#d-part", maximo: 600, tasa: 120,
  turbulencia: 0.9, atraccion: 0.4,      <b>// el puntero las arrastra</b>
  colores: ["#F0774A", "#4FC7BE"], estela: 0.9
})`,
      montar(raiz) {
        const host = raiz.querySelector("#d-part");
        let p = null;
        const cfgs = {
          chispas: { maximo: 400, tasa: 140, direccion: -90, apertura: 70, velocidad: [80, 240], gravedad: 0.25, vida: [700, 1600], colores: ["#F0774A", "#FFC36D"], estela: 0.86, y: 0.95, anchoEmision: 0.5, forma: "linea" },
          nieve: { maximo: 500, tasa: 60, direccion: 90, apertura: 40, velocidad: [15, 45], vida: [6000, 9000], colores: ["#EFEDE6"], y: -0.05, anchoEmision: 1.2, tamano: [1, 2.6], turbulencia: 0.12 },
          campo: { maximo: 700, tasa: 200, apertura: 360, velocidad: [5, 25], vida: [3000, 6000], turbulencia: 1.1, atraccion: 0.5, colores: ["#4FC7BE", "#F0774A"], x: 0.5, y: 0.5, anchoEmision: 1, altoEmision: 1, friccion: 0.9, tamano: [1, 2.2] },
        };
        raiz.querySelectorAll("[data-p]").forEach((b) => (b.onclick = () => {
          p?.detener(); p = null;
          if (b.dataset.p === "off") return;
          p = m.particles({ host, ...cfgs[b.dataset.p] });
        }));
        setInterval(() => { raiz.querySelector("#d-part-n").textContent = p ? p.vivas() + " partículas vivas" : "apagado"; }, 200);
      },
    },

    {
      id: "fondos",
      titulo: "Fondos",
      ojo: "Gradientes, aurora, grano",
      lede: "Tres niveles según lo que el efecto necesita de verdad: CSS para un gradiente animado, " +
            "canvas para el grano, shader solo cuando cada píxel es una función distinta.",
      html: `
        <div class="rej r3">
          <div class="demo" id="d-fondo1" style="min-height:190px"><span class="pill">aurora · WebGL</span></div>
          <div class="demo" id="d-fondo2" style="min-height:190px"><span class="pill">manchas · WebGL</span></div>
          <div class="demo" id="d-fondo3" style="min-height:190px"><span class="pill">gradiente · CSS</span></div>
        </div>
        <p class="nota" id="d-fondo-n"></p>`,
      codigo: `motion.background.aurora({ host: "#caja", interactivo: true })
motion.background.blobs({ host: "#caja", colores: [...] })
motion.background.gradient({ host: "#caja" })   <b>// sin canvas, imprime</b>
motion.background.grain({ host: "#caja", intensidad: .08 })`,
      montar(raiz) {
        const a = m.background.aurora({ host: raiz.querySelector("#d-fondo1"), interactivo: true, intensidad: 0.9 });
        const b = m.background.blobs({ host: raiz.querySelector("#d-fondo2"), colores: ["#F0774A", "#4FC7BE", "#FFC36D"] });
        m.background.gradient({ host: raiz.querySelector("#d-fondo3"), velocidad: 14 });
        m.background.grain({ host: raiz.querySelector("#d-fondo1"), intensidad: 0.07 });
        raiz.querySelector("#d-fondo-n").textContent =
          "aurora acelerada: " + a.acelerado() + " · manchas aceleradas: " + b.acelerado();
      },
    },

    {
      id: "tresd",
      titulo: "3D",
      ojo: "Perspectiva y profundidad",
      lede: "CSS 3D, no un renderer: se aplica a DOM vivo, así que el texto sigue siendo seleccionable " +
            "y los enlaces siguen funcionando dentro de la escena.",
      html: `
        <div class="demo alto" id="d-escena" style="display:grid;place-items:center">
          <div class="tarjeta" id="d-card" style="width:260px;padding:22px">
            <h3 data-capa>Una tarjeta</h3>
            <p style="margin:0;font-size:13px" data-capa>El título flota unos píxeles por encima de la superficie. Eso es lo que la hace parecer un objeto.</p>
          </div>
        </div>`,
      codigo: `motion.card3d("#d-card", { grados: 12, elevacion: 40, capa: "[data-capa]" })
motion.scene("#seccion", { perspectiva: 900 })
motion.depth("#seccion > *", { paso: -140 })
motion.camera("#seccion", { grados: 6 })`,
      montar(raiz) {
        m.card3d(raiz.querySelector("#d-card"), { grados: 12, elevacion: 40, capa: "[data-capa]" });
      },
    },

    {
      id: "efectos",
      titulo: "Efectos",
      ojo: "Distorsión",
      lede: "CSS donde basta — desenfoque, glow — y shader solo donde no: desplazamiento, separación " +
            "RGB, glitch. Lo segundo opera sobre una instantánea, y eso se dice, no se esconde.",
      html: `
        <div class="rej r2">
          <div class="demo"><div class="marco" id="d-glow"><span>glow · CSS</span></div>
            <button class="btn" id="d-glow-b" style="margin-top:14px">encender</button></div>
          <div class="demo"><canvas id="d-src" width="320" height="200" style="display:none"></canvas>
            <div id="d-shader" style="position:relative;width:100%;aspect-ratio:16/10;border-radius:8px;overflow:hidden"></div>
            <div class="fila" style="margin-top:14px">
              <button class="btn" data-fx="desplazar">desplazar</button>
              <button class="btn" data-fx="rgb">RGB</button>
              <button class="btn" data-fx="glitch">glitch</button>
              <button class="btn" data-fx="onda">onda</button>
            </div></div>
        </div>`,
      codigo: `motion.glow("#icono", { color: "#F0774A", radio: 18 })
motion.glitch({ host: "#caja", fuente: lienzo, intensidad: 1 })
motion.rgbSplit({ host: "#caja", fuente: lienzo })   <b>// sigue al puntero</b>`,
      montar(raiz) {
        raiz.querySelector("#d-glow-b").onclick = () => m.glow(raiz.querySelector("#d-glow"), { color: "#F0774A", radio: 18 });

        // Una fuente dibujada a mano: el shader necesita una textura, y así la
        // demo no depende de ningún archivo externo.
        const c = raiz.querySelector("#d-src");
        const g = c.getContext("2d");
        const grad = g.createLinearGradient(0, 0, 320, 200);
        grad.addColorStop(0, "#F0774A"); grad.addColorStop(1, "#4FC7BE");
        g.fillStyle = grad; g.fillRect(0, 0, 320, 200);
        g.fillStyle = "#121311"; g.font = "600 30px ui-monospace, monospace";
        g.fillText("MOTION", 60, 110);
        for (let i = 0; i < 18; i++) { g.globalAlpha = .18; g.fillRect(i * 20, 0, 2, 200); }

        let fx = null;
        raiz.querySelectorAll("[data-fx]").forEach((b) => (b.onclick = () => {
          fx?.detener();
          const host = raiz.querySelector("#d-shader");
          const o = { host, fuente: c, intensidad: 1, velocidad: 1 };
          fx = b.dataset.fx === "rgb" ? m.rgbSplit(o)
             : b.dataset.fx === "glitch" ? m.glitch(o)
             : b.dataset.fx === "onda" ? m.ripple(o)
             : m.displace(o);
          if (!fx.activo()) raiz.querySelector("#d-shader").textContent = "WebGL no disponible aquí";
        }));
      },
    },

    {
      id: "audio",
      titulo: "Audio",
      ojo: "Motion reactivo al sonido",
      lede: "Una fuente, no un efecto: produce números y cualquier propiedad los consume. El contexto " +
            "de audio no arranca sin un gesto, así que esto pide permiso y no finge lo contrario.",
      html: `
        <div class="demo">
          <div class="fila">
            <button class="btn" id="d-audio-on">activar micrófono</button>
            <span class="pill" id="d-bpm">bpm —</span>
          </div>
          <div class="fila" style="margin-top:20px;align-items:flex-end;height:90px">
            <div class="caja" id="d-a1" style="width:56px;height:56px">graves</div>
            <div class="caja" id="d-a2" style="width:56px;height:56px;background:var(--ac2)">medios</div>
            <div class="caja" id="d-a3" style="width:56px;height:56px;background:var(--tx3)">agudos</div>
          </div>
          <div class="meta"><i id="d-amp"></i></div>
        </div>`,
      codigo: `const a = motion.audio({ fuente: "microfono" })
await a.iniciar()                      <b>// debe venir de un gesto</b>
motion.bindAudio(a, (v) =&gt; caja.style.transform = \`scale(\${v})\`,
  { banda: "graves", rango: [1, 1.6], golpe: 0.25 })`,
      montar(raiz) {
        const a = m.audio({ fuente: "microfono" });
        raiz.querySelector("#d-audio-on").onclick = async () => {
          const ok = await a.iniciar();
          raiz.querySelector("#d-audio-on").textContent = ok ? "escuchando" : "no disponible";
          if (!ok) return;
          const caja = (id) => raiz.querySelector(id);
          m.bindAudio(a, (v) => (caja("#d-a1").style.transform = `scale(${v})`), { banda: "graves", rango: [1, 1.7], golpe: 0.3 });
          m.bindAudio(a, (v) => (caja("#d-a2").style.transform = `scale(${v})`), { banda: "medios", rango: [1, 1.5] });
          m.bindAudio(a, (v) => (caja("#d-a3").style.transform = `scale(${v})`), { banda: "agudos", rango: [1, 1.4] });
          a.al((b) => {
            raiz.querySelector("#d-amp").style.width = (b.amplitud * 100).toFixed(0) + "%";
            raiz.querySelector("#d-bpm").textContent = "bpm " + (b.bpm || "—");
          });
        };
      },
    },

    {
      id: "procedural",
      titulo: "Procedural",
      ojo: "Ruido y osciladores",
      lede: "Dos senos de frecuencias no relacionadas leen como algo vivo; uno solo lee como un " +
            "mecanismo. Todo lo que no termina se registra y se puede parar de una vez.",
      html: `
        <div class="demo alto" style="display:grid;place-items:center">
          <div class="fila" id="d-flotar">
            ${Array.from({ length: 5 }, (_, i) => `<div class="caja">${i + 1}</div>`).join("")}
          </div>
          <div class="fila" style="margin-top:22px">
            <button class="btn" id="d-flotar-on">flotar</button>
            <button class="btn" id="d-oscilar-on">oscilar</button>
            <button class="btn" id="d-pausa">pausar todos los bucles</button>
          </div>
        </div>`,
      codigo: `motion.float("#cajas div", { amplitud: 14, periodo: 3600, giro: 5 })
motion.a11y.pauseLoops(true)   <b>// el único control que exige WCAG 2.2.2</b>`,
      montar(raiz) {
        const cajas = raiz.querySelectorAll("#d-flotar div");
        let c = null;
        raiz.querySelector("#d-flotar-on").onclick = () => { c?.detener(); c = m.float(cajas, { amplitud: 14, periodo: 3600, giro: 5 }); };
        raiz.querySelector("#d-oscilar-on").onclick = () => { c?.detener(); c = m.oscillate(cajas, { propiedad: "escala", amplitud: 0.12, periodo: 1600 }); };
        raiz.querySelector("#d-pausa").onclick = (e) => {
          const on = !m.a11y.loopsPaused();
          m.a11y.pauseLoops(on);
          e.target.textContent = on ? "reanudar los bucles" : "pausar todos los bucles";
        };
      },
    },

    {
      id: "transiciones",
      titulo: "Transiciones",
      ojo: "Entre páginas",
      lede: "Sobre View Transitions donde existe — el navegador fotografía ambos estados y los cruza " +
            "en el compositor. Donde no, un velo. Menos capaz, pero nunca deja la página a medias.",
      html: `
        <div class="demo">
          <div class="fila">
            <button class="btn" data-tr="fade">fade</button>
            <button class="btn" data-tr="circulo">círculo</button>
            <button class="btn" data-tr="barrido">barrido</button>
            <button class="btn" data-tr="cortina">cortina</button>
          </div>
          <p class="nota" id="d-tr-n">soporte nativo: <b id="d-tr-s"></b></p>
        </div>`,
      codigo: `motion.transition(() =&gt; router.push("/siguiente"), { tipo: "circulo" })
motion.linkTransitions({ tipo: "fade" })   <b>// intercepta &lt;a&gt; del mismo origen</b>`,
      montar(raiz) {
        raiz.querySelector("#d-tr-s").textContent = typeof document.startViewTransition === "function" ? "sí" : "no, usa el velo";
        raiz.querySelectorAll("[data-tr]").forEach((b) => (b.onclick = () => {
          m.transition(() => {
            document.documentElement.dataset.tema = document.documentElement.dataset.tema === "claro" ? "oscuro" : "claro";
          }, { tipo: b.dataset.tr, duracion: 700 });
        }));
      },
    },

    {
      id: "cadena",
      titulo: "Cadena",
      ojo: "API",
      lede: "Los pasos corren uno tras otro, cada uno cuando el anterior se asentó. La cola es perezosa: " +
            "se construye entera antes del primer frame.",
      html: `
        <div class="demo" style="display:grid;place-items:center;min-height:200px">
          <div class="caja" id="d-cadena">motion</div>
          <button class="btn" id="d-cadena-b" style="margin-top:20px">correr</button>
        </div>`,
      codigo: `motion(el)
  .fadeIn()
  .slideUp()
  .scale(1.2)
  .muelle("elastico")
  .rotate(180)
  .then(() =&gt; console.log("listo"))`,
      montar(raiz) {
        const el = raiz.querySelector("#d-cadena");
        raiz.querySelector("#d-cadena-b").onclick = () => {
          el.style.transform = "";
          m(el).fadeIn().slideUp().scale(1.2).muelle("elastico").rotate(180).scale(1).rotate(0);
        };
      },
    },
  ];

  // --- construir la página -------------------------------------------------
  for (const s of SECCIONES) {
    const sec = document.createElement("section");
    sec.id = s.id;
    sec.innerHTML =
      `<p class="ojo">${s.ojo}</p>` +
      `<h${s.id === "inicio" ? 1 : 2}>${s.titulo}</h${s.id === "inicio" ? 1 : 2}>` +
      `<p class="lede">${s.lede}</p>` +
      (s.html || "") +
      (s.codigo ? `<pre>${s.codigo}</pre>` : "");
    main.appendChild(sec);
    const a = document.createElement("a");
    a.href = "#" + s.id;
    a.textContent = s.titulo.toLowerCase();
    nav.appendChild(a);
  }

  // Montar después de un frame: las secciones tienen que existir y estar
  // maquetadas antes de que nada mida.
  requestAnimationFrame(() => {
    for (const s of SECCIONES) {
      try {
        s.montar?.(document.getElementById(s.id));
      } catch (e) {
        console.error("[playground] " + s.id, e);
      }
    }
  });

  // Revelar cada sección al entrar, con la regla de siempre: si este script no
  // corriera, todo seguiría visible.
  m.reveal("section > .ojo, section > h1, section > h2, section > .lede, section > .rej, section > .demo, section > pre", {
    tipo: "slide-up", escalonado: 40, umbral: 0.1,
  });

  // --- chrome ---------------------------------------------------------------
  const enlaces = [...nav.querySelectorAll("a")];
  const io = new IntersectionObserver((e) => {
    for (const x of e) {
      if (!x.isIntersecting) continue;
      enlaces.forEach((a) => a.classList.toggle("on", a.getAttribute("href") === "#" + x.target.id));
    }
  }, { rootMargin: "-40% 0px -55% 0px" });
  document.querySelectorAll("section").forEach((s) => io.observe(s));

  document.getElementById("tema").onclick = () => {
    const r = document.documentElement;
    r.dataset.tema = r.dataset.tema === "claro" ? "oscuro" : "claro";
  };
  const bdbg = document.getElementById("dbg");
  bdbg.onclick = () => {
    m.debug = !m.debug;
    bdbg.setAttribute("aria-pressed", String(m.debug));
  };
  const bred = document.getElementById("reduce");
  bred.onclick = () => {
    const on = bred.getAttribute("aria-pressed") !== "true";
    m.a11y.force(on ? "reducido" : null);
    bred.setAttribute("aria-pressed", String(on));
    bred.textContent = on ? "movimiento reducido" : "movimiento";
  };
})();
</script>
</body>
</html>
