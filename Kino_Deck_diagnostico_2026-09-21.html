<!DOCTYPE html>
<!--
  Hanademi-style research deck — self-contained runtime.
  HOW TO USE: replace the DECK object below (see the ==DECK DATA== block).
  Everything else (CSS + rendering engine) is compiled from engine/src and stays as-is.
  No external network calls except an optional Google Font. Works offline / as an artifact.
  Keyboard: ↑↓ / ←→ / Space navigate · o outline · s presenter notes · a self-audit · d author mode
            · t theme · f fullscreen · b blank screen · ? shortcuts.
-->
<html lang="es" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Research deck</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Un solo host de fuentes (el único permitido en un artifact). Fraunces/Plex sirven
     al sistema Probatorio; Archivo/JetBrains Mono a la marca Kino (data-brand="kino"). -->
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,650&family=IBM+Plex+Mono:wght@400;500;600&family=Archivo:ital,wdth,wght@0,62..125,400..900;1,62..125,400..900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  /* ============================================================================
     PROBATORIO — the design system behind Hanademi decks.
     Identity in one line: confidence is visible. A forensic-editorial system for
     evidence-first decks — a serif carries human judgment, a monospace carries
     everything auditable (numbers, units, sources, labels), the body reads in the
     system font. Thin evidence stays visually thin.
     Token layers: PRIMITIVES → SEMANTIC (theme-flipped) → COMPONENT.
     Accessibility is a property of the tokens: every text pair is WCAG 2.2 AA in
     both themes (APCA Lc reported by the engine), focus is visible, motion is
     opt-out. Do not hardcode colors in content — reference the semantic tokens.
     ============================================================================ */

  /* ---- PRIMITIVES (raw values, no meaning) ---------------------------------- */
  :root{
    /* type */
    --font-display:"Fraunces",Georgia,"Times New Roman",serif;
    --font-mono:"IBM Plex Mono",ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
    --font-sans:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    /* fluid type scale (make-it-big display, quiet body) */
    --fs-display:clamp(34px,6.4vw,74px);
    --fs-head:clamp(26px,4.3vw,47px);
    --fs-quote:clamp(23px,3.6vw,38px);
    --fs-num:clamp(40px,6.6vw,68px);
    --fs-lede:clamp(17px,1.1vw + 14px,21px);
    --fs-body:17px;
    --fs-label:12px;      /* mono evidence labels */
    --fs-micro:11px;
    /* spacing rhythm (8px base) */
    --sp-1:6px; --sp-2:10px; --sp-3:16px; --sp-4:24px; --sp-5:36px; --sp-6:56px;
    /* geometry — crisp, architectural (forensic, not soft) */
    --maxw:1000px;
    --slide-pad:clamp(26px,5vw,76px);
    --r:10px; --r-sm:6px; --r-pill:999px;
    /* motion — calm, functional */
    --dur:.24s; --dur-slow:.5s; --ease:cubic-bezier(.2,.7,.2,1);
    --transition:var(--dur) var(--ease);
    /* default signal / instrument accents (a preset may override per deck-type) */
    --accent:#BE3E19;      /* SIGNAL — the finding, emphasis, disagreement */
    --accent-2:#0C6E6A;    /* INSTRUMENT — verified, series 2, source links */
    /* fixed evidence hues (dots only; polarity of confidence, not text) */
    --ev-single:#B07A24;      /* one source        */
    --ev-projection:#6E5CD8;  /* forecast/estimate  */
  }

  /* ---- SEMANTIC (meaning; flips per theme) ---------------------------------- */
  [data-theme="light"]{
    --bg:#F3F1EC; --surface:#FBFAF7; --surface-2:#ECE9E2;
    --ink:#191712; --ink-soft:#57524A; --ink-faint:#736D60;
    --line:#E5E1D8; --line-strong:#D2CDC1;
    --chip-bg:#ECE8E0; --grid:#EBE7DE; --track:#E7E2D8; --bar-neutral:#C3BCAD;
    --shadow:0 18px 50px rgba(40,34,22,.14);
    --ev-single:#B07A24; --ev-projection:#6E5CD8;
  }
  [data-theme="dark"]{
    --bg:#121311; --surface:#1A1B18; --surface-2:#0D0E0C;
    --ink:#EFEDE6; --ink-soft:#BAB5A9; --ink-faint:#8B857A;
    --line:#2B2D28; --line-strong:#3D3F39;
    --chip-bg:#23241F; --grid:#26271F; --track:#262820; --bar-neutral:#4C4E45;
    --shadow:0 18px 50px rgba(0,0,0,.42);
    --accent:#F0774A; --accent-2:#4FC7BE;
    --ev-single:#DCA94E; --ev-projection:#A99BF0;
  }

  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg);color:var(--ink);font-family:var(--font-sans);
    font-size:var(--fs-body);line-height:1.55;-webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;font-optical-sizing:auto;
    transition:background var(--transition),color var(--transition);
  }
  /* Visible keyboard focus everywhere (WCAG 2.2 Focus Appearance). */
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:var(--r-sm)}
  a{color:inherit}

  /* ---------- top chrome ---------- */
  .chrome{
    position:fixed;top:0;left:0;right:0;height:56px;z-index:50;
    display:flex;align-items:center;justify-content:space-between;
    padding:0 clamp(14px,3vw,22px);background:color-mix(in srgb,var(--bg) 86%,transparent);
    backdrop-filter:blur(12px);border-bottom:1px solid var(--line);
  }
  .brand{font-family:var(--font-display);font-weight:600;font-size:15px;letter-spacing:-.005em;display:flex;gap:9px;align-items:center}
  .brand .dot{width:8px;height:8px;border-radius:2px;background:var(--accent);display:inline-block;transform:rotate(45deg)}
  .brand small{font-family:var(--font-mono);color:var(--ink-faint);font-weight:400;font-size:11px;letter-spacing:0}
  .controls{display:flex;gap:8px;align-items:center}
  .seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:var(--r-pill);overflow:hidden;background:var(--surface)}
  .seg button{background:transparent;border:0;color:var(--ink-faint);font:500 12px/1 var(--font-mono);letter-spacing:.02em;padding:8px 13px;min-height:34px;cursor:pointer;transition:var(--transition)}
  .seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
  .seg button:hover{color:var(--ink)}
  .iconbtn{width:36px;height:36px;border:1px solid var(--line-strong);border-radius:var(--r-pill);background:var(--surface);color:var(--ink-soft);cursor:pointer;font-size:15px;display:grid;place-items:center;transition:var(--transition)}
  .iconbtn:hover{color:var(--ink);border-color:var(--ink-faint)}

  /* ---------- deck layout ---------- */
  main{scroll-snap-type:y proximity;scroll-behavior:smooth}
  .slide{
    min-height:100vh;scroll-snap-align:start;display:grid;place-items:center;
    padding:96px var(--slide-pad) 84px;position:relative;
  }
  .slide-inner{width:100%;max-width:var(--maxw);animation:rise var(--dur-slow) var(--ease) both}
  @keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){.slide-inner,.slide-inner *{animation:none!important;transition:none!important}}

  /* Kicker = the evidence spine: a mono section tag on a short accent rule. */
  .kicker{font:500 var(--fs-label)/1 var(--font-mono);letter-spacing:.16em;text-transform:uppercase;color:var(--accent);margin-bottom:var(--sp-4);display:flex;gap:10px;align-items:center}
  .kicker::before{content:"";width:26px;height:2px;background:var(--accent);display:inline-block}

  h1.title{font-family:var(--font-display);font-weight:600;font-size:var(--fs-display);line-height:1.02;letter-spacing:-.02em;max-width:20ch}
  h2.head{font-family:var(--font-display);font-weight:600;font-size:var(--fs-head);line-height:1.08;letter-spacing:-.015em;margin-bottom:var(--sp-3);max-width:22ch}
  .lede{font-size:var(--fs-lede);color:var(--ink-soft);max-width:60ch;line-height:1.5}
  .body-txt{font-size:var(--fs-body);color:var(--ink-soft);max-width:64ch;line-height:1.6}
  .body-txt + .body-txt{margin-top:12px}

  /* cover */
  .cover .lede{margin-top:var(--sp-4)}
  .cover .meta{margin-top:var(--sp-5);display:flex;flex-wrap:wrap;gap:10px 22px;font-family:var(--font-mono);font-size:12px;color:var(--ink-faint);letter-spacing:.01em}
  .cover .meta b{color:var(--ink-soft);font-weight:500}
  .thesis{margin-top:var(--sp-4);padding:18px 22px;border-left:3px solid var(--accent);background:var(--surface);border-radius:0 var(--r) var(--r) 0;font-family:var(--font-display);font-weight:500;font-size:clamp(18px,2.3vw,24px);line-height:1.36}

  /* stat — numbers speak in the mono evidence voice */
  .stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:16px;margin-top:12px}
  .stat{padding:24px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);position:relative}
  .stat .num{font-family:var(--font-mono);font-weight:600;font-size:var(--fs-num);line-height:1;letter-spacing:-.03em;font-variant-numeric:tabular-nums;color:var(--ink)}
  .stat .num .unit{font-family:var(--font-mono);font-size:.32em;color:var(--ink-faint);font-weight:500;margin-left:6px;letter-spacing:0}
  .stat .lbl{margin-top:14px;font-size:14px;color:var(--ink-soft);line-height:1.45}

  /* comparison */
  .cols{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:8px}
  @media(max-width:640px){.cols{grid-template-columns:1fr}}
  .col{padding:22px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
  .col h3{font:500 12px/1 var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-faint);margin-bottom:14px}
  .col .cnum{font-family:var(--font-mono);font-size:clamp(28px,3.4vw,36px);font-weight:600;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
  .col ul{list-style:none;margin-top:12px}
  .col li{padding:9px 0;border-top:1px solid var(--line);font-size:15px;color:var(--ink-soft);display:flex;justify-content:space-between;gap:12px}
  .col li b{color:var(--ink);font-weight:600;font-family:var(--font-mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}

  /* table */
  table.dt{width:100%;border-collapse:collapse;margin-top:8px;font-size:15px}
  table.dt th,table.dt td{text-align:left;padding:12px 12px;border-bottom:1px solid var(--line)}
  table.dt th{font:500 11px/1 var(--font-mono);letter-spacing:.07em;text-transform:uppercase;color:var(--ink-faint)}
  table.dt td.n{text-align:right;font-family:var(--font-mono);font-variant-numeric:tabular-nums;font-weight:500;letter-spacing:-.01em}
  table.dt tr:last-child td{border-bottom:0}

  /* charts */
  .chart-wrap{margin-top:6px}
  .chart-unit{color:var(--ink-faint);margin-top:-4px;margin-bottom:16px}
  .bars{display:flex;flex-direction:column;gap:14px;margin-top:6px}
  .bar-row{display:grid;grid-template-columns:minmax(96px,30%) 1fr auto;gap:16px;align-items:center}
  .bar-row .bl{font-size:14px;color:var(--ink-soft);line-height:1.25}
  .bar-track{height:28px;background:var(--track);border-radius:var(--r-sm);overflow:hidden;position:relative}
  .bar-fill{height:100%;border-radius:var(--r-sm);width:0;background:var(--bar,var(--accent-2));transform-origin:left center;transition:width .9s var(--ease)}
  .bar-val{font-family:var(--font-mono);font-variant-numeric:tabular-nums;font-weight:600;font-size:14px;min-width:58px;text-align:right;letter-spacing:-.01em}
  .unit-note{margin-top:14px;font-size:12.5px;color:var(--ink-faint);line-height:1.45;max-width:62ch;padding-left:12px;border-left:2px solid var(--line-strong)}

  /* timeline */
  .timeline{margin-top:12px;border-left:2px solid var(--line-strong);padding-left:24px;display:flex;flex-direction:column;gap:22px}
  .tl-item{position:relative}
  .tl-item::before{content:"";position:absolute;left:-30px;top:5px;width:10px;height:10px;border-radius:2px;background:var(--accent);border:2px solid var(--bg);transform:rotate(45deg)}
  .tl-item .tl-when{font:500 11px/1 var(--font-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin-bottom:6px}
  .tl-item .tl-what{font-size:15px;color:var(--ink-soft);line-height:1.5}

  /* quote */
  .quote{font-family:var(--font-display);font-weight:500;font-size:var(--fs-quote);line-height:1.28;letter-spacing:-.015em;max-width:24ch}
  .quote .mark{color:var(--accent)}
  .quote-cite{margin-top:22px;font-family:var(--font-mono);font-size:13px;color:var(--ink-faint);letter-spacing:.01em}

  /* data gap — the honest slide; dashed = unfilled */
  .gap-box{border:1px dashed var(--line-strong);border-radius:var(--r);padding:24px;background:var(--surface);margin-top:6px}
  .gap-box h3{font:500 11px/1 var(--font-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint);margin-bottom:16px;display:flex;gap:9px;align-items:center}
  .gap-box h3::before{content:"—";color:var(--accent)}
  .gap-list{list-style:none;display:flex;flex-direction:column;gap:11px}
  .gap-list li{font-size:15.5px;color:var(--ink-soft);padding-left:22px;position:relative;line-height:1.5}
  .gap-list li::before{content:"?";position:absolute;left:0;color:var(--accent);font-weight:700;font-family:var(--font-mono)}

  /* recommendations */
  .recs{display:flex;flex-direction:column;gap:12px;margin-top:6px;counter-reset:r}
  .rec{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:start;padding:18px 20px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
  .rec .rn{counter-increment:r;font-family:var(--font-mono);font-size:22px;font-weight:600;color:var(--accent);line-height:1.2;min-width:34px;letter-spacing:-.02em}
  .rec .rn::before{content:counter(r,decimal-leading-zero)}
  .rec .rt{font-weight:600;font-size:16px;margin-bottom:5px;line-height:1.35}
  .rec .rd{font-size:14.5px;color:var(--ink-soft);line-height:1.5}

  /* ---- evidence badges + source line (confidence is visible) --------------- */
  .foot{margin-top:var(--sp-5);padding-top:14px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;font-size:12.5px}
  .badge{display:inline-flex;align-items:center;gap:7px;padding:5px 11px;border-radius:var(--r-pill);font:500 var(--fs-micro)/1 var(--font-mono);letter-spacing:.04em;text-transform:uppercase;border:1px solid var(--line-strong);color:var(--ink-soft);background:var(--chip-bg)}
  .badge::before{content:"";width:7px;height:7px;border-radius:var(--r-pill)}
  /* verified reads strongest — full confidence gets a tinted, solid chip */
  .b-verified{background:color-mix(in srgb,var(--accent-2) 15%,var(--surface));border-color:color-mix(in srgb,var(--accent-2) 45%,transparent);color:var(--accent-2)}
  .b-verified::before{background:var(--accent-2)}
  /* thinner evidence stays neutral; only the dot carries the hue */
  .b-single::before{background:var(--ev-single)}
  .b-projection::before{background:var(--ev-projection)}
  .b-projection{border-style:dashed}
  .b-analysis::before{background:var(--ink-faint)}
  .b-disagreement{background:color-mix(in srgb,var(--accent) 12%,var(--surface));border-color:color-mix(in srgb,var(--accent) 45%,transparent);color:var(--accent)}
  .b-disagreement::before{background:var(--accent)}
  .src{color:var(--ink-faint);display:inline-flex;gap:6px;align-items:baseline;font-family:var(--font-mono);font-size:12px;letter-spacing:0}
  .src a{color:var(--ink-soft);text-decoration:none;border-bottom:1px solid var(--line-strong)}
  .src a:hover{color:var(--accent-2);border-color:var(--accent-2)}
  .src .pub{font-weight:600;color:var(--ink-soft)}

  /* sources appendix */
  .srclist{list-style:none;margin-top:12px;display:flex;flex-direction:column;gap:2px}
  .srclist li{display:grid;grid-template-columns:auto 1fr;gap:16px;padding:13px 0;border-top:1px solid var(--line);font-size:14px;line-height:1.5}
  .srclist li .sid{font-family:var(--font-mono);font-variant-numeric:tabular-nums;color:var(--accent);font-weight:600;font-size:12px}
  .srclist li .spub{font-weight:600}
  .srclist li a{color:var(--accent-2);text-decoration:none;word-break:break-all;font-family:var(--font-mono);font-size:12.5px}
  .srclist li a:hover{text-decoration:underline}
  .srclist li .sacc{color:var(--ink-faint);font-family:var(--font-mono);font-size:12px}

  /* progress + nav */
  .progress{position:fixed;left:0;top:56px;height:2px;background:var(--accent);width:0;z-index:49;transition:width .2s ease}
  .pager{position:fixed;right:18px;bottom:18px;z-index:50;display:flex;gap:6px;align-items:center;background:color-mix(in srgb,var(--surface) 90%,transparent);border:1px solid var(--line);border-radius:var(--r-pill);padding:6px 8px;backdrop-filter:blur(10px)}
  .pager button{width:32px;height:32px;border-radius:var(--r-pill);border:0;background:transparent;color:var(--ink-soft);cursor:pointer;font-size:15px;display:grid;place-items:center;transition:var(--transition)}
  .pager button:hover{background:var(--chip-bg);color:var(--ink)}
  .pager .count{font-family:var(--font-mono);font-variant-numeric:tabular-nums;font-size:12px;color:var(--ink-faint);min-width:46px;text-align:center}
  .slide-num{position:absolute;left:var(--slide-pad);bottom:28px;font-family:var(--font-mono);font-size:11px;color:var(--ink-faint);font-variant-numeric:tabular-nums;letter-spacing:.02em}
  [lang-hide]{display:none!important}

  /* ============================================================
     ANATOMY EXTENSIONS ("Anatomy of an excellent deck")
     ============================================================ */
  /* (L) epistemic backing micro-label */
  .support{display:inline-flex;align-items:center;font:600 10px/1 var(--font-mono);letter-spacing:.08em;padding:4px 7px;border-radius:var(--r-sm);border:1px solid var(--line-strong);color:var(--ink-soft);background:var(--chip-bg)}
  .support.s-evid{border-color:var(--accent-2);color:var(--accent-2)}
  .support.s-cons{border-color:var(--ink-faint)}
  .support.s-opin{border-style:dashed}
  /* (E) preattentive emphasis — the scalpel; colour comes from inline --bar */
  .bar-fill.is-emph{box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--accent) 45%,transparent)}
  /* (G) estimate rendering: hatched fill + dashed outline = not measured */
  .bar-fill.is-estimate{background-image:repeating-linear-gradient(45deg,color-mix(in srgb,var(--bg) 58%,transparent) 0 6px,transparent 6px 12px);outline:1.5px dashed color-mix(in srgb,var(--ink-faint) 80%,transparent);outline-offset:-2px}
  .stat.is-estimate{border-style:dashed;border-color:var(--ink-faint)}
  .stat.is-estimate .num::after{content:"≈";font-size:.34em;color:var(--ink-faint);vertical-align:super;margin-left:5px;font-weight:500}
  /* (A) author-mode title warning */
  .author-warn{display:none}
  html[data-author="1"] .author-warn{display:block;margin-top:10px;font:500 12px/1.4 var(--font-mono);color:var(--accent);letter-spacing:0;text-transform:none;background:color-mix(in srgb,var(--accent) 10%,transparent);border:1px solid color-mix(in srgb,var(--accent) 45%,transparent);border-radius:var(--r-sm);padding:8px 11px;max-width:44ch}
  /* (J) CTA / emphasis slides */
  .emph-slide{background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 5%,transparent),transparent 42%)}
  .cta-slide .kicker{color:var(--accent)}
  .cta-list{display:flex;flex-direction:column;gap:14px;margin-top:18px}
  .cta-item{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:start;padding:20px 22px;border:1px solid var(--accent);border-radius:var(--r);background:color-mix(in srgb,var(--accent) 6%,var(--surface))}
  .cta-mark{width:12px;height:12px;border-radius:3px;background:var(--accent);margin-top:7px;transform:rotate(45deg)}
  .cta-action{font-family:var(--font-display);font-size:clamp(19px,2.3vw,25px);font-weight:600;line-height:1.22;letter-spacing:-.01em}
  .cta-metarow{display:flex;flex-wrap:wrap;gap:8px 22px;margin-top:10px}
  .cta-meta{font-family:var(--font-mono);font-size:12.5px;color:var(--ink-soft)}
  .cta-meta b{color:var(--ink-faint);font-weight:500;text-transform:uppercase;letter-spacing:.06em;font-size:10px;margin-right:5px}
  /* keys hint + author banner */
  .keys-hint{position:fixed;left:16px;bottom:16px;z-index:48;font:400 11px/1 var(--font-mono);color:var(--ink-faint);background:color-mix(in srgb,var(--surface) 88%,transparent);border:1px solid var(--line);border-radius:var(--r-pill);padding:8px 13px;backdrop-filter:blur(8px);pointer-events:none;letter-spacing:.01em}
  @media(max-width:720px){.keys-hint{display:none}}
  .author-banner{position:fixed;left:50%;top:64px;transform:translateX(-50%);z-index:60;font:500 12px/1.35 var(--font-mono);color:var(--ink);background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--r);padding:9px 14px;box-shadow:var(--shadow);display:flex;gap:10px;align-items:center;max-width:92vw;flex-wrap:wrap}
  .author-banner b{color:var(--accent)}
  .author-banner .ab-ok{color:var(--accent-2);font-weight:600}
  .author-banner .ab-bad{color:var(--accent);font-weight:600}
  .author-banner .ab-keys{color:var(--ink-faint)}

  /* ---------- overlays (outline / presenter / audit) ---------- */
  .overlay{position:fixed;inset:0;z-index:70;background:color-mix(in srgb,var(--bg) 68%,rgba(0,0,0,.55));backdrop-filter:blur(7px);display:grid;place-items:start center;overflow:auto;padding:68px 20px 40px}
  .overlay[hidden]{display:none}
  .ov-panel{width:100%;max-width:780px;background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--r);padding:32px 34px;position:relative;box-shadow:var(--shadow);animation:rise .3s var(--ease) both}
  .ov-panel.ov-wide{max-width:1000px}
  .ov-close{position:absolute;top:16px;right:16px;width:36px;height:36px;border-radius:var(--r-pill);border:1px solid var(--line-strong);background:var(--bg);color:var(--ink-soft);cursor:pointer;font-size:14px}
  .ov-close:hover{color:var(--ink);border-color:var(--ink-faint)}
  .ov-kicker{font:600 11px/1 var(--font-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
  .ov-h{font-family:var(--font-display);font-weight:600;font-size:clamp(21px,2.6vw,29px);line-height:1.12;letter-spacing:-.015em;margin:14px 0 6px}
  .ov-hint{font-size:14px;color:var(--ink-soft);margin-bottom:18px;max-width:62ch}
  /* outline list */
  .ol-thesis{margin-top:8px;font-family:var(--font-display);font-weight:500;font-size:19px;line-height:1.4;padding:13px 17px;border-left:3px solid var(--accent);background:var(--bg);border-radius:0 var(--r-sm) var(--r-sm) 0}
  .ol-list{list-style:none;counter-reset:none;display:flex;flex-direction:column}
  .ol-row{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:baseline;padding:13px 10px;border-top:1px solid var(--line);cursor:pointer;border-radius:var(--r-sm)}
  .ol-row:hover{background:var(--chip-bg)}
  .ol-row .ol-n{font-family:var(--font-mono);font-variant-numeric:tabular-nums;color:var(--ink-faint);font-weight:600;font-size:12px}
  .ol-row .ol-t{font-family:var(--font-display);font-size:17px;line-height:1.32;color:var(--ink)}
  .ol-row.ol-cover .ol-t{color:var(--accent)}
  .ol-row .ol-type{font:600 9px/1 var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-faint)}
  /* presenter side panel */
  .overlay.presenter{background:transparent;backdrop-filter:none;place-items:end stretch;padding:0;pointer-events:none}
  .overlay.presenter .pr-inner{pointer-events:auto;position:fixed;right:0;top:56px;bottom:0;width:min(430px,86vw);background:var(--surface);border-left:1px solid var(--line-strong);box-shadow:var(--shadow);padding:26px 28px;overflow:auto;animation:slideIn .28s var(--ease) both}
  @keyframes slideIn{from{transform:translateX(20px);opacity:0}to{transform:none;opacity:1}}
  @media (prefers-reduced-motion:reduce){.overlay.presenter .pr-inner{animation:none}}
  .pr-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
  .pr-pos{font-family:var(--font-mono);font-variant-numeric:tabular-nums;font-size:12px;color:var(--ink-faint);font-weight:600}
  .pr-notes-h{font:600 11px/1 var(--font-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint);margin-bottom:9px}
  .pr-notes{font-size:16px;line-height:1.6;color:var(--ink);min-height:60px;padding-bottom:20px;border-bottom:1px solid var(--line)}
  .pr-notes .muted{color:var(--ink-faint);font-style:italic}
  .pr-guide{margin-top:18px;display:flex;flex-direction:column;gap:10px}
  .pr-g-row{font-size:13.5px;line-height:1.5;color:var(--ink-soft)}
  .pr-g-row b{color:var(--ink);font-weight:600}
  .pr-g-row.pr-err{color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,transparent);padding:10px 12px;border-radius:var(--r-sm)}
  .pr-g-row.pr-err b{color:var(--accent)}
  /* audit */
  .au-score{display:flex;gap:20px;align-items:center;margin:6px 0 22px;padding:18px 20px;border:1px solid var(--line);border-radius:var(--r);background:var(--bg)}
  .au-num{font-family:var(--font-mono);font-weight:600;font-size:44px;line-height:1;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
  .au-num .au-den{font-size:.4em;color:var(--ink-faint);font-weight:500;margin-left:5px}
  .au-meta{flex:1}
  .au-grade{font-weight:600;font-size:15px;margin-bottom:8px;font-family:var(--font-mono);letter-spacing:.01em}
  .au-grade.au-excellent{color:var(--accent-2)}
  .au-grade.au-solid{color:var(--accent-2)}
  .au-grade.au-work{color:var(--ev-single)}
  .au-grade.au-rewrite{color:var(--accent)}
  .au-bar{height:8px;border-radius:var(--r-pill);background:var(--track);overflow:hidden}
  .au-bar span{display:block;height:100%;background:var(--accent-2);border-radius:var(--r-pill);transition:width .4s ease}
  .au-sub{margin-top:8px;font-family:var(--font-mono);font-size:12px;color:var(--ink-faint);font-variant-numeric:tabular-nums}
  .au-cols{display:grid;grid-template-columns:1fr 1fr;gap:26px}
  @media(max-width:720px){.au-cols{grid-template-columns:1fr}}
  .au-gh{font:600 11px/1 var(--font-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint);margin-bottom:11px}
  .ck-list{list-style:none;display:flex;flex-direction:column;gap:2px}
  .ck{font-size:13.5px;line-height:1.45;padding:9px 0;border-top:1px solid var(--line)}
  .ck-l{color:var(--ink-soft)}
  .ck-tag{font:600 9px/1 var(--font-mono);letter-spacing:.07em;text-transform:uppercase;color:var(--ink-faint);border:1px solid var(--line-strong);border-radius:4px;padding:3px 5px;margin-left:8px;vertical-align:middle}
  .ck-detail{color:var(--ink-faint);font-family:var(--font-mono);font-variant-numeric:tabular-nums;font-size:12px;margin-left:4px}
  .ck-auto{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start}
  .ck-auto .ck-mark{font-weight:700;line-height:1.45}
  .ck-auto.ok .ck-mark{color:var(--accent-2)}
  .ck-auto.bad .ck-mark{color:var(--accent)}
  .ck-manual label{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;cursor:pointer}
  .ck-manual input{margin-top:2px;width:16px;height:16px;accent-color:var(--accent-2)}

  /* ============================================================
     MICROINTERACTIONS (functional: state, attention, confirmation)
     Every rule below is transform/opacity only, gated behind
     html.fx so content is fully visible if the enhancement script
     never runs, and silenced under prefers-reduced-motion.
     ============================================================ */

  /* Buttons confirm the presenter's action with a quick press. */
  .seg button,.iconbtn,.pager button{transition:background var(--transition),color var(--transition),border-color var(--transition),transform var(--dur) var(--ease)}
  .iconbtn:active,.pager button:active,.seg button:active{transform:scale(.92)}
  .iconbtn.is-on{color:var(--ink);border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,var(--surface))}

  /* Data containers lift slightly on hover — a depth cue while
     reviewing, never movement the seated audience has to track. */
  .stat,.col,.rec,.cta-item{transition:transform var(--dur) var(--ease),box-shadow var(--dur) var(--ease),border-color var(--transition)}
  @media (hover:hover) and (prefers-reduced-motion:no-preference){
    .stat:hover,.col:hover,.rec:hover,.cta-item:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
    .stat:hover,.rec:hover{border-color:var(--line-strong)}
  }
  .bar-fill{will-change:width,transform}

  @media (prefers-reduced-motion:no-preference){
    /* Staggered entry: the eye reads kicker → title → body → data,
       replacing the engine's single block rise so it plays on each
       arrival at a slide (the presenter advances, the slide assembles). */
    html.fx .slide-inner{animation:none!important}
    html.fx .slide-inner>*{opacity:0;transform:translateY(10px)}
    html.fx .slide.is-in .slide-inner>*{opacity:1;transform:none;transition:opacity var(--dur-slow) var(--ease),transform var(--dur-slow) var(--ease)}
    html.fx .slide.is-in .slide-inner>*:nth-child(2){transition-delay:.05s}
    html.fx .slide.is-in .slide-inner>*:nth-child(3){transition-delay:.10s}
    html.fx .slide.is-in .slide-inner>*:nth-child(4){transition-delay:.15s}
    html.fx .slide.is-in .slide-inner>*:nth-child(5){transition-delay:.20s}
    html.fx .slide.is-in .slide-inner>*:nth-child(n+6){transition-delay:.24s}

    /* The finding's bar gets one attention pulse once it has filled. */
    .bar-fill.is-emph.pulse{animation:barPulse 1.1s var(--ease) 1}
    @keyframes barPulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 55%,transparent)}70%{box-shadow:0 0 0 7px color-mix(in srgb,var(--accent) 0%,transparent)}100%{box-shadow:0 0 0 0 transparent}}

    /* Timeline diamonds resolve down the sequence, tracing the order. */
    html.fx .slide.is-in .tl-item::before{animation:diamondIn var(--dur-slow) var(--ease) both}
    html.fx .slide.is-in .tl-item:nth-child(2)::before{animation-delay:.08s}
    html.fx .slide.is-in .tl-item:nth-child(3)::before{animation-delay:.16s}
    html.fx .slide.is-in .tl-item:nth-child(4)::before{animation-delay:.24s}
    html.fx .slide.is-in .tl-item:nth-child(n+5)::before{animation-delay:.30s}
    @keyframes diamondIn{from{transform:rotate(45deg) scale(0)}60%{transform:rotate(45deg) scale(1.25)}to{transform:rotate(45deg) scale(1)}}
  }

  /* Blank-screen: a presenter's black-out to pull all eyes back. */
  #blankVeil{position:fixed;inset:0;background:#0a0a08;z-index:80;opacity:0;pointer-events:none;transition:opacity var(--dur) var(--ease)}
  html.is-blank #blankVeil{opacity:1;pointer-events:auto}
  .pager .pdiv{width:1px;height:20px;background:var(--line-strong);margin:0 3px}
  #btnBlank,#btnFs,#btnHelp{font-size:14px}
  #btnHelp{font-family:var(--font-mono);font-weight:600}

  /* Keyboard-shortcut help table (reuses overlay chrome). */
  .kbd-grid{display:grid;grid-template-columns:auto 1fr;gap:12px 20px;margin-top:6px}
  .kbd-grid .kkey{display:flex;gap:6px;flex-wrap:wrap;justify-self:start}
  .kbd-grid kbd{font:600 12px/1 var(--font-mono);color:var(--ink);background:var(--bg);border:1px solid var(--line-strong);border-bottom-width:2px;border-radius:var(--r-sm);padding:5px 8px;min-width:24px;text-align:center}
  .kbd-grid .kdesc{color:var(--ink-soft);font-size:14px;align-self:center;line-height:1.4}
  .kbd-sec{grid-column:1/-1;font:600 10px/1 var(--font-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-faint);margin-top:12px}

  @media print{
    .chrome,.pager,.progress,.overlay,.keys-hint,.author-banner,#blankVeil,.lz-zoom{display:none}
    .slide{min-height:auto;page-break-after:always;padding:40px}
    .lz{max-height:520px;overflow:hidden}
    .slide-inner{animation:none}
  }

  /* ---- Mechanism slide: the flow instead of the paragraph -----------------
     The drawing is rendered twice, once per theme, because an SVG does not
     recolor itself and a diagram that is illegible in one theme is a diagram
     nobody reads. Only the one matching the theme is displayed. */
  .slide-inner.lz-slide{max-width:min(1760px,94vw)}
  .lz{position:relative;margin:var(--sp-4) 0 0;width:100%;border-radius:var(--r);
      overflow:hidden;border:1px solid var(--line);background:var(--surface)}
  .lz svg{display:block;width:100%;height:auto}
  .lz-pie{margin-top:var(--sp-3);font-size:14px;color:var(--ink-soft);max-width:88ch}
  html[data-theme="light"] .lz-oscuro{display:none}
  html[data-theme="dark"] .lz-claro{display:none}
  @media print{.lz-oscuro{display:none}.lz-claro{display:block}}

  /* Expanding a canvas: the slide shows a window onto the drawing; the expanded
     view shows the whole document — header, legend and evidence note. */
  .lz-zoom{position:absolute;top:10px;right:10px;z-index:2;
    width:38px;height:38px;display:grid;place-items:center;cursor:pointer;
    font:600 17px/1 var(--font-mono);border-radius:var(--r-pill);
    border:1px solid var(--line-strong);background:var(--surface);color:var(--ink-soft);
    opacity:0;transition:opacity var(--dur) var(--ease),color var(--dur) var(--ease),border-color var(--dur) var(--ease)}
  .lz:hover .lz-zoom,.lz-zoom:focus-visible{opacity:1}
  .lz-zoom:hover{color:var(--ink);border-color:var(--accent-2)}
  @media (hover:none){.lz-zoom{opacity:1}}

  .lz-modal[hidden]{display:none}
  .lz-modal{position:fixed;inset:0;z-index:90;display:grid;grid-template-rows:auto 1fr;
    gap:12px;padding:14px clamp(14px,3vw,28px) clamp(14px,3vw,28px);
    background:color-mix(in srgb,var(--bg) 94%,#000)}
  .lz-modal-top{display:flex;align-items:center;justify-content:space-between;gap:16px}
  .lz-modal-t{font:600 13px/1.3 var(--font-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-faint)}
  .lz-modal-x{width:38px;height:38px;border-radius:var(--r-pill);cursor:pointer;
    border:1px solid var(--line-strong);background:var(--surface);color:var(--ink-soft);font-size:15px}
  .lz-modal-x:hover{color:var(--ink);border-color:var(--ink-faint)}
  .lz-modal figure{margin:0;min-height:0;display:grid;place-items:center;
    border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
  .lz-modal svg{display:block;width:100%;height:100%;max-height:100%;object-fit:contain}

/* ============================================================================
   Kino — capa de marca y composición sobre el sistema Probatorio.

   Dos cosas que el motor base no tiene:
   1. COMPOSICIÓN. Un deck medido tenía 30 de 31 láminas abriendo en
      `kicker > head` dentro de una columna de 1000px con un solo margen.
      Aquí cada forma ocupa un tramo distinto de la retícula y se ancla distinto.
   2. MOVIMIENTO CON SIGNIFICADO. Tres curvas que no son intercambiables:
      crecer (lo que aparece), decaer (lo que vence) y latir (lo que está vivo).

   Los colores salen de branding/sistema/palette.json. Generado: no editar a mano.
   ============================================================================ */

html:root[data-brand="kino"] {
  /* --- tipografía --- */
  --font-display: "Archivo", "Archivo Expanded", system-ui, sans-serif;
  --font-sans: "Archivo", system-ui, -apple-system, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;

  /* --- retícula --- */
  --k-cols: 12;
  --k-canal: 24px;
  --k-borde: clamp(28px, 4.6vw, 84px);
  --maxw: none;

  /* --- movimiento: las tres curvas de la marca --- */
  --kino-crecer: 420ms cubic-bezier(.16,.84,.30,1);
  --kino-decaer: 900ms cubic-bezier(.62,.03,.86,.34);
  --kino-latir: 1800ms cubic-bezier(.45,0,.55,1);

  --r: 8px; --r-sm: 4px;
}

html:root[data-brand="kino"][data-theme="dark"] {
  --bg:#011F16; --surface:#0B2A20; --surface-2:#00140C;
  --ink:#EFFCF7; --ink-soft:#BECBC6; --ink-faint:#86A799;
  --line:#2A483D; --line-strong:#68897B;
  --chip-bg:#17362B; --grid:#17362B;
  --track:#17362B; --bar-neutral:#426155;
  --accent:#FF7D76;        /* señal: el hallazgo */
  --accent-2:#00BB83;      /* instrumento: lo verificado y las fuentes */
  --ev-single:#FFC36D;     /* una sola fuente */
  --ev-projection:#B6CEFF;/* proyección: lo inferido */
  --shadow: 0 1px 0 0 #2A483D inset, 0 18px 50px -20px #000;
  --k-resplandor: 0 0 0 1px #009467, 0 0 28px -8px #00EAA5;
}

html:root[data-brand="kino"][data-theme="light"] {
  --bg:#E5F3ED; --surface:#EFFCF7; --surface-2:#DBE9E3;
  --ink:#00140C; --ink-soft:#17362B; --ink-faint:#426155;
  --line:#CEDCD6; --line-strong:#6A7671;
  --chip-bg:#DBE9E3; --grid:#DBE9E3;
  --track:#DBE9E3; --bar-neutral:#ABB8B3;
  --accent:#AA1620;
  --accent-2:#006343;
  --ev-single:#764E00;
  --ev-projection:#244EB5;
  --shadow: 0 1px 0 0 #fff inset, 0 16px 44px -22px #0b201a;
  --k-resplandor: 0 0 0 1px #00845B, 0 0 22px -10px #00845B;
}

/* ---------------------------------------------------------------------------
   COMPOSICIÓN
   Cada forma ocupa un tramo distinto de las 12 columnas y se ancla distinto.
   Eso es lo que rompe el metrónomo: anchos y márgenes dejan de ser dos.
   --------------------------------------------------------------------------- */
html[data-brand="kino"] .slide {
  padding-inline: var(--k-borde);
  place-items: start stretch;
  align-content: center;
}
html[data-brand="kino"] .slide-inner { max-width: none; width: 100%; }

/* columna · 7 de 12, a la izquierda. El caballo de batalla. */
html[data-brand="kino"] .in-columna { width: min(calc(7 / 12 * 100%), 860px); }

/* partido · el titular y el contenido dejan de apilarse */
html[data-brand="kino"] .in-partido {
  display: grid; grid-template-columns: minmax(0, 4fr) minmax(0, 6fr);
  gap: var(--k-canal) calc(var(--k-canal) * 2.5); align-items: start;
}
html[data-brand="kino"] .in-partido > .kicker,
html[data-brand="kino"] .in-partido > .head { grid-column: 1; }
html[data-brand="kino"] .in-partido > .head { margin-bottom: 0; }
html[data-brand="kino"] .in-partido > :not(.kicker):not(.head) { grid-column: 2; }
html[data-brand="kino"] .in-partido > .foot { grid-column: 1 / -1; margin-top: var(--sp-4); }

/* nota · dos párrafos no tienen que apilarse: el segundo baja a un riel al margen.
   Esta es la forma que rompe las once láminas idénticas del deck medido. */
html[data-brand="kino"] .in-nota {
  display: grid;
  grid-template-columns: minmax(0, 6fr) minmax(0, 3.2fr);
  gap: var(--sp-2) calc(var(--k-canal) * 2);
  align-items: start;
  width: min(calc(10.5 / 12 * 100%), 1260px);
  margin-inline-start: calc((1 / 12) * 100%);
}
html[data-brand="kino"] .in-nota > .kicker,
html[data-brand="kino"] .in-nota > .head { grid-column: 1; }
html[data-brand="kino"] .in-nota > .body-txt:first-of-type { grid-column: 1; }
html[data-brand="kino"] .in-nota > .body-txt:first-of-type ~ .body-txt {
  grid-column: 2; grid-row: 3 / span 2;
  border-inline-start: 2px solid var(--line-strong);
  padding-inline-start: 18px;
  font-size: .93em; color: var(--ink-soft); align-self: start;
}
html[data-brand="kino"] .in-nota > .foot { grid-column: 1; }
/* Espejo: dos `nota` seguidas no repiten el mismo lado. */
html[data-brand="kino"] .in-nota.rail-izq { grid-template-columns: minmax(0, 3.2fr) minmax(0, 6fr); margin-inline-start: 0; }
html[data-brand="kino"] .in-nota.rail-izq > .kicker,
html[data-brand="kino"] .in-nota.rail-izq > .head,
html[data-brand="kino"] .in-nota.rail-izq > .body-txt:first-of-type,
html[data-brand="kino"] .in-nota.rail-izq > .foot { grid-column: 2; }
html[data-brand="kino"] .in-nota.rail-izq > .body-txt:first-of-type ~ .body-txt {
  grid-column: 1; text-align: right;
  border-inline-start: 0; border-inline-end: 2px solid var(--line-strong);
  padding-inline-start: 0; padding-inline-end: 18px;
}

/* partido · el titular y el contenido dejan de apilarse, y alternan de lado. */
html[data-brand="kino"] .in-partido.rail-izq { grid-template-columns: minmax(0, 6fr) minmax(0, 4fr); }
html[data-brand="kino"] .in-partido.rail-izq > .kicker,
html[data-brand="kino"] .in-partido.rail-izq > .head { grid-column: 2; }
html[data-brand="kino"] .in-partido.rail-izq > :not(.kicker):not(.head):not(.foot) { grid-column: 1; }

/* matriz · una tabla o un gráfico piden ancho, y el titular se va a un riel arriba */
html[data-brand="kino"] .in-matriz {
  display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 9fr);
  gap: var(--sp-2) calc(var(--k-canal) * 2); align-items: start; width: 100%;
}
html[data-brand="kino"] .in-matriz > .kicker,
html[data-brand="kino"] .in-matriz > .head { grid-column: 1; }
html[data-brand="kino"] .in-matriz > .head { margin-bottom: 0; font-size: clamp(20px, 2.2vw, 30px); }
html[data-brand="kino"] .in-matriz > :not(.kicker):not(.head) { grid-column: 2; }
html[data-brand="kino"] .in-matriz table.dt { font-size: .95em; }

/* lista · lo enumerado se reparte en dos columnas: una tira de cuatro tarjetas
   apiladas se sale de la pantalla, y lo que queda bajo el pliegue no se presenta. */
html[data-brand="kino"] .in-lista {
  display: grid; grid-template-columns: minmax(0, 3.4fr) minmax(0, 8.6fr);
  gap: var(--sp-2) calc(var(--k-canal) * 2); align-items: start; width: 100%;
}
html[data-brand="kino"] .in-lista > .kicker,
html[data-brand="kino"] .in-lista > .head { grid-column: 1; }
html[data-brand="kino"] .in-lista > .head { margin-bottom: 0; }
html[data-brand="kino"] .in-lista > :not(.kicker):not(.head) { grid-column: 2; }
html[data-brand="kino"] .in-lista .recs {
  display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px;
}
html[data-brand="kino"] .in-lista .gap-box { background: none; border: 0; padding: 0; }
html[data-brand="kino"] .in-lista .gap-list { columns: 2; column-gap: calc(var(--k-canal) * 2); }
html[data-brand="kino"] .in-lista .gap-list li { break-inside: avoid; }

/* cierre · la decisión se ancla a la derecha. Lo que cambia es el anclaje, no la
   alineación del texto: tres acciones en bandera derecha se leen peor, y una
   decisión es justamente lo que no puede costar trabajo leer. */
html[data-brand="kino"] .in-cierre {
  width: min(calc(8 / 12 * 100%), 980px);
  margin-inline-start: auto;
}
html[data-brand="kino"] .in-cierre .cta-item { border-color: var(--accent); }

/* índice · las fuentes son un aparato, no una lámina de lectura. Van a ancho
   completo y en cuerpo pequeño para que las diez quepan en una pantalla: una
   lista de fuentes que hay que desplazar no se audita durante la sustentación.
   No se parten en dos columnas porque las URL largas no toleran la medida. */
html[data-brand="kino"] .in-indice { width: 100%; }
html[data-brand="kino"] .in-indice > .head { font-size: clamp(22px, 2.6vw, 34px); margin-bottom: var(--sp-1); }
html[data-brand="kino"] .in-indice .srclist li { padding: 7px 0; font-size: 13px; line-height: 1.42; }
html[data-brand="kino"] .in-indice .srclist li a { font-size: 11.5px; }

/* sangre · el dibujo es la lámina */
html[data-brand="kino"] .in-sangre { width: 100%; }

/* cifra · un número llena el cuadro */
html[data-brand="kino"] .in-cifra {
  display: grid; grid-template-columns: minmax(0, 7fr) minmax(0, 5fr);
  gap: var(--k-canal) calc(var(--k-canal) * 2); align-items: end;
}
html[data-brand="kino"] .in-cifra > .kicker,
html[data-brand="kino"] .in-cifra > .foot { grid-column: 1 / -1; }
html[data-brand="kino"] .in-cifra > .head { grid-column: 2; align-self: end; font-size: var(--fs-head); }
html[data-brand="kino"] .in-cifra .stat-grid { grid-column: 1; grid-template-columns: 1fr; }
html[data-brand="kino"] .in-cifra .stat { border: 0; background: none; padding: 0; }
html[data-brand="kino"] .in-cifra .num { font-size: clamp(76px, 13vw, 196px); letter-spacing: -.045em; line-height: .88; }
html[data-brand="kino"] .in-cifra .num .unit { font-size: .17em; }

/* díptico · dos panes del mismo peso, sin columna central */
html[data-brand="kino"] .in-diptico { width: 100%; }
html[data-brand="kino"] .in-diptico .cols { gap: calc(var(--k-canal) * 1.5); }

/* respiro · una pausa: una afirmación y nada más */
html[data-brand="kino"] .in-respiro {
  width: min(calc(9 / 12 * 100%), 1040px); margin-inline: auto; text-align: left;
}
html[data-brand="kino"] .in-respiro .quote { max-width: 18ch; font-size: clamp(34px, 5.2vw, 68px); line-height: 1.1; }
html[data-brand="kino"] .lay-respiro { background: var(--surface-2); }

/* portada · la tesis anclada abajo a la izquierda */
html[data-brand="kino"] .in-portada { width: min(calc(8 / 12 * 100%), 980px); }
html[data-brand="kino"] .in-portada .title { font-size: clamp(46px, 8.4vw, 118px); line-height: .96; letter-spacing: -.035em; }

/* El display de Kino va ancho y pesado. */
html[data-brand="kino"] .title,
html[data-brand="kino"] .head,
html[data-brand="kino"] .quote,
html[data-brand="kino"] .cta-action { font-stretch: 112%; font-weight: 800; letter-spacing: -.022em; }
html[data-brand="kino"] .thesis { font-weight: 700; font-stretch: 106%; }
/* Cifras y códigos: cero barrado. Una placa mal leída es un ingreso mal concedido. */
html[data-brand="kino"] .num, html[data-brand="kino"] .cnum,
html[data-brand="kino"] .bar-val, html[data-brand="kino"] td.n,
html[data-brand="kino"] .src, html[data-brand="kino"] .kicker {
  font-variant-numeric: tabular-nums slashed-zero;
}

/* ---------------------------------------------------------------------------
   MOVIMIENTO
   --------------------------------------------------------------------------- */
@media (prefers-reduced-motion: no-preference) {
  html[data-brand="kino"].fx .slide-inner > * { opacity: 0; transform: translateY(12px); }
  html[data-brand="kino"].fx .slide.is-in .slide-inner > * {
    opacity: 1; transform: none;
    transition: opacity var(--kino-crecer), transform var(--kino-crecer);
  }
  html[data-brand="kino"].fx .slide.is-in .slide-inner > :nth-child(2) { transition-delay: 55ms; }
  html[data-brand="kino"].fx .slide.is-in .slide-inner > :nth-child(3) { transition-delay: 110ms; }
  html[data-brand="kino"].fx .slide.is-in .slide-inner > :nth-child(4) { transition-delay: 165ms; }
  html[data-brand="kino"].fx .slide.is-in .slide-inner > :nth-child(n+5) { transition-delay: 220ms; }

  /* Lo verificado está vivo: late al entrar la lámina y se queda quieto.
     Dos ciclos, 3.6 s. No es una elección estética: un elemento que se mueve
     solo de forma indefinida durante más de cinco segundos incumple WCAG 2.2.2
     si no hay forma de pausarlo, y no la hay en una proyección. */
  html[data-brand="kino"] .slide.is-in .b-verified::before {
    /* `--kino-latir` ya trae duración Y curva. Añadir `ease-in-out` mete dos
       funciones de tiempo en el atajo, el navegador descarta la declaración
       entera y la animación no corre: falla en silencio, sin error. */
    animation: k-latir var(--kino-latir) 2;
  }
  @keyframes k-latir { 0%,100% { opacity: 1; } 50% { opacity: .38; } }

  /* Una proyección no se afirma: respira más despacio. */
  html[data-brand="kino"] .b-projection { transition: opacity var(--kino-decaer); }
}
html[data-brand="kino"] .bar-fill { transition: width var(--kino-crecer); }
html[data-brand="kino"] .stat:hover, html[data-brand="kino"] .col:hover { box-shadow: var(--k-resplandor); border-color: transparent; }
html[data-brand="kino"] :where(a, button, [tabindex]):focus-visible {
  outline: 2px solid var(--accent-2); outline-offset: 2px; border-radius: var(--r-sm);
}

       [{en:"Validity of his own permit", es:"Vigencia de su propio permiso"}, {en:"no", es:"no"}, {en:"yes", es:"sí"}],
       [{en:"Whether his vehicle actually synced", es:"Si su vehículo se sincronizó de verdad"}, {en:"no", es:"no"}, {en:"yes", es:"sí"}],
       [{en:"The word Permitted", es:"La palabra Permitido"}, {en:"yes", es:"sí"}, {en:"yes", es:"sí"}]
     ],
     unitNote:{en:"Reading access to identification data of 312 people has no purpose proportional to the work of letting someone in. Ley 1581 applies.", es:"El acceso de lectura a datos de identificación de 312 personas no tiene una finalidad proporcional al trabajo de dejar entrar a alguien. Aplica la Ley 1581."},
     source:"s2", evidence:"verified"},

    {type:"statement",
     kicker:{en:"Open question", es:"Pregunta abierta"},
     head:{en:"Whoever registers a third party takes on data obligations", es:"Quien registra a un tercero asume obligaciones de tratamiento"},
     body:[
       {en:"Ley 1581 of 2012 treats guest and visitor data as personal data, requiring authorisation and a clear purpose. Every visitor record creates an obligation.", es:"La Ley 1581 de 2012 trata los datos de invitados y visitantes como datos personales, con autorización y finalidad clara. Cada registro de un visitante genera una obligación."},
       {en:"If the resident registers his guests, someone has to answer for that data. Who the data controller is in that case has no answer today, and it crosses directly with the question of who answers for the entry.", es:"Si el residente registra a sus invitados, alguien debe responder por esos datos. Quién es el responsable del tratamiento en ese caso no tiene respuesta hoy, y se cruza con la pregunta de quién responde por el ingreso."}
     ],
     source:"s10", evidence:"verified", support:"CONS"},

    {type:"statement",
     kicker:{en:"Finding 7", es:"Hallazgo 7"},
     head:{en:"Expiry already exists, hidden from whoever would set it", es:"La vigencia ya existe, oculta para quien sabría fijarla"},
     body:[
       {en:"Every vehicle carries Valid From and Valid Until, in windows of a year. The guard sees those dates. The administrator sees them. The owner of the car does not.", es:"Cada vehículo tiene Válido Desde y Válido Hasta, en ventanas de un año. El portero ve esas fechas. El administrador las ve. El dueño del carro no."},
       {en:"What the redesign would have to invent for visits is already running in production. Extending expiry to people stops being a new feature and becomes a migration of an existing pattern.", es:"Lo que el rediseño tendría que inventar para las visitas ya corre en producción. Extender la vigencia a personas deja de ser una función nueva y pasa a ser una migración de un patrón existente."}
     ],
     source:"s1", evidence:"verified"},

    {type:"statement",
     kicker:{en:"Finding 8", es:"Hallazgo 8"},
     head:{en:"The guest is enrolled as a permanent member of the community", es:"El invitado queda matriculado como miembro permanente del conjunto"},
     body:[
       {en:"In a property record, people appear with the role Visitor, attached indefinitely, with an account. No date, no expiry, no event. There were two in house 346.", es:"En la ficha de una propiedad aparecen personas con rol Visitante, asociadas de forma indefinida, con cuenta. Sin fecha, sin vigencia, sin evento. En la casa 346 había dos."},
       {en:"That is why the guest has to register. Nobody is inviting him; he is being enrolled in a physical security system.", es:"Por eso el invitado tiene que registrarse. Nadie lo está invitando: lo están matriculando en un sistema de seguridad física."}
     ],
     source:"s1", evidence:"verified"},

    {type:"bars",
     kicker:{en:"Environment", es:"Entorno"},
     head:{en:"Day-work passed half of all domestic employment contracts", es:"El trabajo por días superó la mitad de los contratos domésticos"},
     unit:{en:"% of domestic employment contracts, Colombia", es:"% de contratos de trabajo doméstico, Colombia"},
     bars:[
       {label:{en:"First half 2025", es:"Primer semestre 2025"}, value:42.8},
       {label:{en:"First half 2026", es:"Primer semestre 2026"}, value:51.3, emphasis:true}
     ],
     unitNote:{en:"Same unit and same survey in both bars: GEIH, read by Universidad del Rosario and partners. Informality in the sector exceeds 87%.", es:"Misma unidad y misma encuesta en las dos barras: GEIH, leída por la Universidad del Rosario y aliados. La informalidad del sector supera el 87%."},
     source:"s4", evidence:"single",
     notes:{en:"The client says collaborators are the most frequent entry. The system has zero contractors registered. The most frequent entry is the only one with no model.", es:"El cliente dice que los colaboradores son el ingreso más frecuente. El sistema tiene cero contratistas registrados. El ingreso más frecuente es el único sin modelar."}},

    {type:"statement",
     kicker:{en:"Environment", es:"Entorno"},
     head:{en:"The SIC banned making entry conditional on facial recognition", es:"La SIC prohibió condicionar el ingreso al reconocimiento facial"},
     body:[
       {en:"Resolution 52185 of 28 August 2025 ordered a residential complex to enable entry mechanisms that do not involve biometric processing, and requires prior, express and informed authorisation.", es:"La Resolución 52185 del 28 de agosto de 2025 ordenó a un conjunto residencial habilitar mecanismos de ingreso que no impliquen tratamiento biométrico, y exige autorización previa, expresa e informada."},
       {en:"Ley 1581 of 2012 covers visitors' data. One of the integrations Kino keeps as a strength is also legal exposure for the party that buys.", es:"La Ley 1581 de 2012 cubre los datos de los visitantes. Una de las integraciones que Kino conserva como fortaleza es también exposición legal para quien compra."}
     ],
     source:"s5", evidence:"verified", support:"CONS"},

    {type:"statement",
     kicker:{en:"Benchmark", es:"Benchmark"},
     head:{en:"Resident autonomy already exists in the market", es:"La autonomía del residente ya existe en el mercado"},
     body:[
       {en:"Neivor lets the resident generate QR codes for visits. ButterflyMX issues visitor passes with no account, including recurring ones. Neither integrates with the access hardware already installed.", es:"Neivor permite al residente generar códigos QR para sus visitas. ButterflyMX emite pases de visitante sin cuenta, también recurrentes. Ninguno se integra con el hardware de acceso ya instalado."},
       {en:"Kino's defensible difference sits in that integration, in the account-free guest and in white label. Autonomy on its own is a product debt, not an advantage.", es:"La diferencia defendible de Kino está en esa integración, en el invitado sin cuenta y en la marca blanca. La autonomía por sí sola es una deuda del producto, no una ventaja."}
     ],
     source:"s6", evidence:"verified"},

    {type:"statement",
     kicker:{en:"The buyer's economics", es:"La economía de quien compra"},
     head:{en:"Condominium costs climb faster than inflation, and the argument fell", es:"La copropiedad sube más que la inflación, y el argumento cayó"},
     body:[
       {en:"Condominium services rose 13.42% year on year in May 2026 against inflation of 5.84%, and close to 70% of the fee goes to personnel-intensive services such as security. The figure is correct.", es:"Los servicios de copropiedad subieron 13,42% anual en mayo de 2026 frente a una inflación de 5,84%, y cerca del 70% de la cuota se va en servicios intensivos en personal, como la vigilancia. La cifra es correcta."},
       {en:"The bridge we were building on it no longer holds: we promised to free the manual approval time, and that time does not exist. What does hold is infrastructure already paid for and not operating, legal exposure with a date, and a gap nobody owns.", es:"El puente que construíamos sobre ella ya no se sostiene: prometíamos liberar el tiempo de aprobación manual, y ese tiempo no existe. Lo que sí se sostiene es infraestructura ya pagada y sin operar, exposición legal con fecha, y un agujero que nadie asume."}
     ],
     source:"s8", evidence:"single",
     notes:{en:"Do not use the first argument in the defence until the team has the Refugio infrastructure invoices.", es:"No usar el primer argumento en la sustentación hasta tener las facturas de la infraestructura de Refugio."}},

    {type:"stat",
     kicker:{en:"Why white label", es:"Por qué marca blanca"},
     head:{en:"Living in a gated complex is the urban norm in Colombia", es:"Vivir en conjunto cerrado es la norma urbana en Colombia"},
     stats:[
       {num:"47.88", unit:"%", lbl:{en:"Of urban housing in Colombia sits in horizontal property", es:"De la vivienda urbana de Colombia está en propiedad horizontal"}},
       {num:"61.7", unit:"%", lbl:{en:"In Medellín", es:"En Medellín"}}
     ],
     source:"s9", evidence:"single",
     notes:{en:"The same problem of deciding who enters repeats across thousands of complexes. That is what gives white label its meaning, and it is a business objective outside the guiding question.", es:"El mismo problema de decidir quién entra se repite en miles de conjuntos. Eso da sentido a la marca blanca, y es un objetivo de negocio por fuera de la pregunta guía."}},

    {type:"statement",
     kicker:{en:"Diagnosis", es:"Diagnóstico"},
     head:{en:"The system handed out authority badly and then stopped recording it", es:"El sistema repartió mal la autoridad y después dejó de registrarla"},
     body:[
       {en:"The resident exercises a power over access that the product does not recognise, does not bound and does not write down. The administration believes it keeps a control it does not exercise.", es:"El residente ejerce un poder de acceso que el producto no reconoce, no acota y no deja por escrito. La administración cree conservar un control que no ejerce."},
       {en:"The object that would make that decision governable, a permit with an author, a reason and an expiry, is missing from the model. Nobody in Monte Sereno can answer who authorised the person who came in on Tuesday at three.", es:"El objeto que haría gobernable esa decisión, un permiso con autor, motivo y vigencia, falta en el modelo. Nadie en Monte Sereno puede responder quién autorizó a la persona que entró el martes a las tres."}
     ],
     source:"s1", evidence:"analysis"},

    {type:"comparison",
     kicker:{en:"What changed", es:"Qué cambió"},
     head:{en:"The problem moves from a bottleneck to an absence of governance", es:"El problema pasa de cuello de botella a ausencia de gobierno"},
     left:{title:{en:"Previous version", es:"Versión anterior"}, num:"?",
       rows:[
         {k:{en:"Nature", es:"Naturaleza"}, v:{en:"Concentrated authority", es:"Autoridad concentrada"}},
         {k:{en:"Who decides", es:"Quién decide"}, v:{en:"The super admin", es:"El super admin"}},
         {k:{en:"What to remove", es:"Qué quitar"}, v:{en:"An approval step", es:"Un paso de aprobación"}},
         {k:{en:"The ask", es:"La petición"}, v:{en:"Let go of control", es:"Soltar el control"}}
       ]},
     right:{title:{en:"Corrected version", es:"Versión corregida"}, num:"✓",
       rows:[
         {k:{en:"Nature", es:"Naturaleza"}, v:{en:"Ungoverned authority", es:"Autoridad sin gobierno"}},
         {k:{en:"Who decides", es:"Quién decide"}, v:{en:"The reader, against a list", es:"El lector, contra una lista"}},
         {k:{en:"What to remove", es:"Qué quitar"}, v:{en:"Nothing; there is no step", es:"Nada; no hay paso"}},
         {k:{en:"The ask", es:"La petición"}, v:{en:"Gain control for the first time", es:"Ganar control por primera vez"}}
       ]},
     source:"s3", evidence:"analysis",
     notes:{en:"The second argument is harder to refute and asks for no act of faith.", es:"El segundo argumento es más difícil de refutar y no pide un acto de fe."}},

    {type:"statement",
     kicker:{en:"Guiding question v1", es:"Pregunta guía v1"},
     head:{en:"How do we return the decision to whoever knows the visitor", es:"Cómo devolvemos la decisión a quien conoce al visitante"},
     body:[
       {en:"How might we make it so that, in a gated community such as Monte Sereno, the decision about who enters is taken by whoever knows the visitor, without the community losing control, traceability or protection of the data of those who enter?", es:"¿Cómo podríamos lograr que, en un conjunto cerrado como Monte Sereno, la decisión sobre quién entra la tome quien conoce al visitante, sin que la comunidad pierda control, trazabilidad ni protección de los datos de quienes ingresan?"},
       {en:"The question survives the correction and its reading changes. It no longer describes moving power away from the super admin. It describes recognising, bounding and recording a power the resident already exercises without knowing it.", es:"La pregunta sobrevive a la corrección y su lectura cambia. Ya no describe trasladar poder desde el super admin. Describe reconocer, acotar y dejar constancia de un poder que el residente ya ejerce sin saberlo."}
     ],
     source:"s7", evidence:"analysis",
     notes:{en:"Scored 24 of 24 against eight criteria. The alternative that only reduced super-admin dependency scored 15 and rests on a bottleneck that does not exist.", es:"Puntuó 24 sobre 24 en ocho criterios. La alternativa que solo reducía la dependencia del super admin puntuó 15 y descansa en un cuello de botella inexistente."}},

    {type:"recommendations",
     kicker:{en:"What the question opens", es:"Lo que abre la pregunta"},
     head:{en:"Four challenges, each traced back to an observed finding", es:"Cuatro retos, cada uno trazado a un hallazgo observado"},
     recs:[
       {t:{en:"Recognise and bound the authority of whoever knows the visitor", es:"Reconocer y acotar la autoridad de quien conoce al visitante"},
        d:{en:"From findings 1 and 3. The decision is already there, without rules. The administration sets quotas, duration and time bands instead of approving case by case.", es:"De los hallazgos 1 y 3. La decisión ya está ahí, sin reglas. La administración fija cupos, duración y franjas en vez de aprobar caso a caso."}},
       {t:{en:"Leave a record of who authorised whom", es:"Dejar constancia de quién autorizó a quién"},
        d:{en:"From findings 3 and 6. Author, reason, moment and window on every permit. The guard sees the why without seeing the ID number.", es:"De los hallazgos 3 y 6. Autor, motivo, momento y ventana en cada permiso. El portero ve el porqué sin ver la cédula."}},
       {t:{en:"Let people in without turning anyone into a user", es:"Dejar entrar sin convertir a nadie en usuario"},
        d:{en:"From findings 7 and 8 and the environment. Occasional visits and recurring collaborators enter with the expiry that already exists for vehicles.", es:"De los hallazgos 7 y 8 y del entorno. Visitas ocasionales y colaboradores recurrentes entran con la vigencia que ya existe para los vehículos."}},
       {t:{en:"Operate on the installed hardware and protect the data", es:"Operar sobre el hardware instalado y proteger los datos"},
        d:{en:"From findings 4 and 5 and the SIC condition. This includes something the earlier versions never named: getting the Refugio integration working.", es:"De los hallazgos 4 y 5 y de la condición de la SIC. Incluye algo que las versiones anteriores nunca nombraban: poner a funcionar la integración de Refugio."}}
     ],
     source:"s7", evidence:"analysis", support:"OPIN"},

    {type:"datagap",
     kicker:{en:"What we do not know", es:"Lo que no sabemos"},
     head:{en:"Three unknowns block architecture decisions before anything else", es:"Tres incógnitas bloquean decisiones de arquitectura antes que todo"},
     items:[
       {en:"Whether HikCentral accepts a temporary credential without creating a person. This decides whether the account-free guest is viable at all.", es:"Si HikCentral admite una credencial temporal sin crear una persona. Esto decide si el invitado sin cuenta es viable."},
       {en:"What authorisation rules Monte Sereno has written down and who answers if something goes wrong. Without this, the limits get invented.", es:"Qué reglas de autorización tiene Monte Sereno escritas y quién responde si algo sale mal. Sin esto, los límites se inventan."},
       {en:"Why the Refugio sync is down and what it takes to bring it back. This decides whether the pilot is Refugio or Villas.", es:"Por qué está caída la sincronización de Refugio y qué hace falta para levantarla. Esto decide si el piloto es Refugio o Villas."},
       {en:"The real mix of entry types. That collaborators are the most frequent entry is a client statement with no count behind it.", es:"La mezcla real de tipos de ingreso. Que los colaboradores sean el ingreso más frecuente es una declaración del cliente sin conteo detrás."},
       {en:"Verbatim quotes from the five residents, and which community they live in. This is the only evidence link with no documented backing.", es:"Citas textuales de los cinco residentes y de qué comunidad son. Es el único eslabón de evidencia sin respaldo documentado."},
       {en:"How biometric consent is handled today and what non-biometric routes exist in the community.", es:"Cómo se maneja hoy el consentimiento biométrico y qué vías no biométricas existen en el conjunto."},
       {en:"What the installed infrastructure in Refugio cost. Without that figure the economic argument stays unquantified.", es:"Cuánto costó la infraestructura instalada en Refugio. Sin esa cifra, el argumento económico queda sin cuantificar."}
     ]},

    help.onclick = (e) => { if (e.target === help) hideHelp(); };
  }
  function ensureHelp() {
    if (help) return;
    help = document.createElement('div');
    help.className = 'overlay'; help.id = 'ov-help';
    help.setAttribute('role', 'dialog'); help.setAttribute('aria-modal', 'true');
    help.hidden = true; document.body.appendChild(help);
  }
  function toggleHelp() {
    ensureHelp();
    if (help.hidden) { buildHelp(); help.hidden = false; } else help.hidden = true;
    const b = byId('btnHelp'); if (b) b.classList.toggle('is-on', !help.hidden);
  }
  function hideHelp() { if (help) help.hidden = true; const b = byId('btnHelp'); if (b) b.classList.remove('is-on'); }

  const bindClick = (id, fn) => { const el = byId(id); if (el) el.onclick = fn; };
  bindClick('btnBlank', toggleBlank);
  bindClick('btnFs', toggleFs);
  bindClick('btnHelp', toggleHelp);
  const veil = byId('blankVeil'); if (veil) veil.onclick = unblank;

  /* keyboard — only the keys the engine leaves free, inputs excepted */
  addEventListener('keydown', (e) => {
    const tag = (document.activeElement && document.activeElement.tagName) || '';
    if (tag === 'INPUT' || tag === 'TEXTAREA' || e.metaKey || e.ctrlKey || e.altKey) return;
    if (root.classList.contains('is-blank') && e.key.toLowerCase() !== 'b') unblank();
    switch (e.key) {
      case 'ArrowRight': e.preventDefault(); press('next'); break;
      case 'ArrowLeft': e.preventDefault(); press('prev'); break;
      case 'f': case 'F': toggleFs(); break;
      case 'b': case 'B': toggleBlank(); break;
      case 't': case 'T': press('themeBtn'); break;
      case '?': case '/': case 'h': case 'H': e.preventDefault(); toggleHelp(); break;
      case 'Escape': hideHelp(); break;
    }
  });

  /* the engine rebuilds #deck on language / author changes — re-apply */
  function tagHint() {
    const hint = byId('keysHint');
    if (hint && !hint.textContent.includes('?')) hint.textContent += ' · ? ' + (root.lang === 'en' ? 'help' : 'ayuda');
  }
  let queued = false;
  const refresh = () => { queued = false; observeSlides(); showCentred(); tagHint(); };
  new MutationObserver(() => { if (!queued) { queued = true; requestAnimationFrame(refresh); } })
    .observe(deck, { childList: true });

  refresh();
})();
</script>
<script>
/* Expandir el lienzo de una lámina de mecanismo.
   El deck dibuja una ventana del flujo; el expandido abre el documento entero,
   con encabezado, leyenda y nota de evidencia (`DECK.posters`). Si no hay póster
   se clona el SVG de la lámina. Si este script nunca corre, la lámina sigue
   siendo legible y el botón simplemente no aparece: es una capa, no un requisito. */
(() => {
  const root = document.documentElement;
  let modal, previo;
  const textos = {
    titulo: { en: 'Full canvas', es: 'Lienzo completo' },
    cerrar: { en: 'Close', es: 'Cerrar' },
  };
  const tr = (k) => (textos[k][root.lang === 'en' ? 'en' : 'es']);
  const visible = (fig) =>
    fig.querySelector(root.dataset.theme === 'light' ? '.lz-claro svg' : '.lz-oscuro svg');

  function crear() {
    if (modal) return modal;
    modal = document.createElement('div');
    modal.className = 'lz-modal';
    modal.hidden = true;
    modal.setAttribute('role', 'dialog');
    modal.setAttribute('aria-modal', 'true');
    modal.setAttribute('aria-label', tr('titulo'));
    modal.innerHTML =
      '<div class="lz-modal-top"><span class="lz-modal-t"></span>' +
      '<button type="button" class="lz-modal-x" aria-label="' + tr('cerrar') + '">\u2715</button></div>' +
      '<figure></figure>';
    modal.querySelector('.lz-modal-x').addEventListener('click', cerrar);
    modal.addEventListener('click', (e) => { if (e.target === modal) cerrar(); });
    document.body.appendChild(modal);
    return modal;
  }

  function abrir(fig) {
    const clave = fig.dataset.lienzo;
    const tema = root.dataset.theme === 'light' ? 'claro' : 'oscuro';
    const posters = (typeof DECK !== 'undefined' && DECK.posters) || null;
    const marcado = (posters && posters[clave] && posters[clave][tema]) || null;
    const m = crear();
    const host = document.createElement('div');
    if (marcado) host.innerHTML = marcado;
    else { const v = visible(fig); if (!v) return; host.appendChild(v.cloneNode(true)); }
    const copia = host.querySelector('svg');
    if (!copia) return;
    const t = copia.querySelector('title');
    m.querySelector('.lz-modal-t').textContent = t ? t.textContent : tr('titulo');
    const f = m.querySelector('figure');
    f.textContent = '';
    f.appendChild(copia);
    previo = document.activeElement;
    m.hidden = false;
    m.querySelector('.lz-modal-x').focus();
  }

  function cerrar() {
    if (!modal || modal.hidden) return;
    modal.hidden = true;
    modal.querySelector('figure').textContent = '';
    if (previo && previo.isConnected) previo.focus();
  }
  const abierto = () => modal && !modal.hidden;

  document.addEventListener('click', (e) => {
    const b = e.target.closest && e.target.closest('.lz-zoom');
    if (b) { e.preventDefault(); e.stopPropagation(); abrir(b.closest('.lz')); }
  });

  /* Escape cierra antes que nada; «e» expande el lienzo de la lámina centrada. */
  addEventListener('keydown', (e) => {
    const tag = (document.activeElement && document.activeElement.tagName) || '';
    if (tag === 'INPUT' || tag === 'TEXTAREA') return;
    if (e.key === 'Escape' && abierto()) { e.preventDefault(); e.stopPropagation(); cerrar(); return; }
    if (abierto()) return;
    if ((e.key === 'e' || e.key === 'E') && !e.metaKey && !e.ctrlKey && !e.altKey) {
      const mid = scrollY + innerHeight / 2;
      let best = null, bestD = Infinity;
      document.querySelectorAll('.slide').forEach((s) => {
        const d = Math.abs(s.offsetTop + s.offsetHeight / 2 - mid);
        if (d < bestD) { bestD = d; best = s; }
      });
      const fig = best && best.querySelector('.lz');
      if (fig) { e.preventDefault(); abrir(fig); }
    }
  }, true);
})();
</script>
</body>
</html>
