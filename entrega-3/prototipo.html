  --kino-estado-negado-borde: var(--kino-estado-rechazado-borde);
  --kino-resplandor-vigente: 0 0 0 1px var(--kino-biolum-l45), 0 0 22px -10px var(--kino-biolum-l45);

/* Prototipo Kino · estilos. Los colores salen de los tokens de marca (kino-tokens.css); la capa biopunk es una

*,*::before,*::after{box-sizing:border-box}

.dato--por-vencer{color:var(--kino-estado-por-vencer-texto)}

.dato--sin-confirmar,.dato--usado,.dato--vencido{color:var(--kino-texto-secundario)}

/* Escenario ----------------------------------------------------------------------------------------- */
.escenario{position:relative;height:100vh;display:grid;grid-template-columns:minmax(0,1fr) 380px;grid-template-rows:auto 1fr;overflow:hidden;background:radial-gradient(120% 90% at 50% 0%,var(--kino-superficie-base),var(--kino-superficie-abismo))}

.micelio{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}

/* Dispositivos -------------------------------------------------------------------------------------- */
.telefono{width:390px;height:844px;border-radius:56px;background:var(--kino-superficie-abismo);border:10px solid #050807;box-shadow:0 0 0 1px #1d2a25,0 40px 80px -30px #000;display:flex;flex-direction:column;overflow:hidden;position:relative;color:var(--kino-texto-primario)}

.telefono__pantalla{flex:1;min-height:0;position:relative}
.tableta,.portatil{width:100%;height:100%;border-radius:28px;border:10px solid #050807;background:var(--kino-superficie-abismo);overflow:hidden;box-shadow:0 0 0 1px #1d2a25,0 40px 80px -30px #000}

.app{position:absolute;inset:0;display:flex;flex-direction:column;overflow:hidden}

.pantalla__scroll::-webkit-scrollbar{display:none}

/* Controles comunes -------------------------------------------------------------------------------- */
.accion{display:flex;align-items:center;justify-content:center;gap:10px;min-height:56px;padding:0 22px;border-radius:var(--kino-forma-radio-control);background:var(--kino-accion-fondo);color:var(--kino-accion-texto);font-weight:700;font-size:17px;width:100%;transition:transform var(--r-tacto-ms) var(--r-tacto),background var(--d-corto),opacity var(--d-corto)}
.accion:active{transform:scale(.97)}
.accion:disabled{opacity:.5;cursor:default}
.accion--crear{background:#00D595}
.accion[aria-disabled="true"]{background:var(--kino-superficie-membrana);color:var(--kino-texto-secundario)}
.accion__motivo{font-weight:600;font-size:15px}
.accion--hecho{background:var(--kino-estado-vigente-fondo);color:var(--kino-estado-vigente-texto);opacity:1!important}
.accion.accion--secundaria-fuerte{width:auto;justify-self:start;background:var(--kino-texto-primario);color:var(--kino-superficie-abismo)}
.secundario-btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 20px;border-radius:var(--kino-forma-radio-control);border:1px solid var(--kino-borde-definido);font-weight:700;width:100%}
.icono-btn{width:44px;height:44px;display:grid;place-items:center;border-radius:999px}
.icono-btn:active{background:var(--kino-superficie-membrana)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 9px;border-radius:var(--kino-forma-radio-chip);font-family:var(--kino-fuente-dato);font-size:12px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;border:1px solid;white-space:nowrap;transition:color var(--d-corto),background var(--d-corto),border-color var(--d-corto)}
.chip--grande{font-size:14px;padding:6px 12px}
.chip__punto{width:7px;height:7px;border-radius:50%;background:currentColor}
.chip--previsto{color:var(--kino-estado-previsto-texto);background:var(--kino-estado-previsto-fondo);border-color:var(--kino-estado-previsto-borde)}
.chip--sin-confirmar{color:var(--kino-estado-sin-confirmar-texto);border-style:dashed;border-color:var(--kino-estado-sin-confirmar-borde)}
/* Sin confirmar: la señal se acumula sin efecto visible (quorum). Punto hueco y quieto; nada gira. */
.chip--sin-confirmar .chip__punto{background:none;border:1.5px solid currentColor}
.chip--vigente{color:var(--kino-estado-vigente-texto);background:var(--kino-estado-vigente-fondo);border-color:var(--kino-estado-vigente-borde)}
/* Vigente brilla quieto, como los hongos luminiscentes; los tres latidos van solo al confirmarse (componentes.tsx). */
.chip--vigente .chip__punto{box-shadow:0 0 6px currentColor}
.chip--por-vencer{color:var(--kino-estado-por-vencer-texto);background:var(--kino-estado-por-vencer-fondo);border-color:var(--kino-estado-por-vencer-borde)}
.chip--usado,.chip--vencido{color:var(--kino-estado-vencido-texto);background:var(--kino-estado-vencido-fondo);border-color:var(--kino-estado-vencido-borde)}
.chip--revocado{color:var(--kino-estado-revocado-texto);background:var(--kino-estado-revocado-fondo);border-color:var(--kino-estado-revocado-borde)}
.chip--rechazado{color:var(--kino-estado-rechazado-texto);background:var(--kino-estado-rechazado-fondo);border-color:var(--kino-estado-rechazado-borde)}
.chip--rechazado .chip__punto{border-radius:1px}
@keyframes latir{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.45;transform:scale(.7)}}
.chip-dato{font-size:13px;padding:5px 10px;border-radius:999px;border:1px solid var(--kino-borde-definido);color:var(--kino-texto-secundario)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip-opcion{padding:10px 16px;border-radius:999px;border:1px solid var(--kino-borde-definido);font-weight:600;font-size:15px;transition:background var(--d-corto),color var(--d-corto)}
.chip-opcion.activo{background:var(--kino-texto-primario);color:var(--kino-superficie-abismo);border-color:transparent}
.campo{display:grid;gap:6px}
.campo input,.campo__fila{min-height:52px;border-radius:var(--kino-forma-radio-control);border:1px solid var(--kino-borde-definido);background:var(--kino-superficie-base);padding:0 14px;font-size:17px;width:100%}
.campo__fila{display:flex;align-items:center;gap:10px}
.campo__fila input{border:0;background:none;padding:0;min-height:0;font-family:var(--kino-fuente-dato);font-size:19px;flex:1;outline:none;align-self:stretch}
.campo input::placeholder{color:var(--kino-texto-tenue)}
.grupo{display:grid;gap:12px;padding:16px;min-width:0;border-radius:var(--kino-forma-radio-tarjeta);background:var(--kino-superficie-elevada);border:1px solid var(--kino-borde-tenue)}
.datos{margin:0;display:grid;gap:10px}
.datos div{display:flex;justify-content:space-between;gap:12px}
.datos dt{color:var(--kino-texto-secundario)}
.datos dd{margin:0}
.segmentado{display:grid;grid-template-columns:1fr 1fr;padding:4px;border-radius:calc(var(--kino-forma-radio-control) + 4px);background:var(--kino-superficie-base);border:1px solid var(--kino-borde-tenue)}
.segmentado button{min-height:46px;border-radius:var(--kino-forma-radio-control);font-weight:700;color:var(--kino-texto-secundario);transition:background var(--r-tacto-ms) var(--r-tacto),color var(--d-corto)}
.segmentado button.activo{background:var(--kino-texto-primario);color:var(--kino-superficie-abismo)}
.pasos{display:grid;gap:8px}
.paso{display:grid;grid-template-columns:56px minmax(0,1fr);align-items:center;gap:12px;min-width:0}
.control{display:grid;grid-template-columns:minmax(0,1fr);gap:8px;min-width:0}
.paso__fila{display:flex;align-items:center;gap:4px;border-radius:var(--kino-forma-radio-control);border:1px solid var(--kino-borde-definido);padding:4px}
.paso__fila button{width:44px;height:44px;border-radius:10px;font-size:22px;background:var(--kino-superficie-membrana)}
.paso__fila button:active{transform:scale(.92)}
.paso__valor{flex:1;min-width:0;text-align:center;font-size:16px;white-space:nowrap}
.dias{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.dias button{min-width:0;height:48px;border-radius:12px;border:1px solid var(--kino-borde-definido);font-weight:700}
.dias button.activo{background:var(--kino-estado-vigente-fondo);border-color:var(--kino-estado-vigente-borde);color:var(--kino-estado-vigente-texto)}
.vigencia-previa{padding:4px 0}
.limites{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:12px;background:var(--kino-superficie-base);color:var(--kino-texto-secundario);font-size:14px;border:1px solid var(--kino-borde-tenue);transition:background var(--d-corto),color var(--d-corto)}
.limites--choca{background:var(--kino-estado-rechazado-fondo);color:var(--kino-estado-rechazado-texto);border-color:var(--kino-estado-rechazado-borde)}
.modos{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:8px;width:100%}
.modos button{display:flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 12px;border-radius:12px;border:1px solid var(--kino-borde-tenue);font-weight:600;color:var(--kino-texto-secundario)}
.opciones{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.opciones--2{grid-template-columns:repeat(2,minmax(0,1fr))}
.opciones--4{grid-template-columns:repeat(4,minmax(0,1fr))}
.opcion{min-height:44px;padding:0 8px;border-radius:12px;border:1px solid var(--kino-borde-definido);font-weight:600;font-size:15px;white-space:nowrap;transition:background var(--d-corto),color var(--d-corto),border-color var(--d-corto)}
.opcion.activo{background:var(--kino-texto-primario);color:var(--kino-superficie-abismo);border-color:transparent}
.opcion:active{transform:scale(.97)}
.previa-pase{display:grid;gap:4px;padding:12px 16px;border-radius:12px;border:1px solid var(--kino-estado-vigente-borde);background:var(--kino-estado-vigente-fondo)}
.previa-pase .dato{color:var(--kino-estado-vigente-texto)}
.previa-pase--choca{border-color:var(--kino-estado-rechazado-borde);background:var(--kino-estado-rechazado-fondo)}
.previa-pase--choca .dato{color:var(--kino-estado-rechazado-texto)}
.modos button.activo{border-color:var(--kino-texto-primario);color:var(--kino-texto-primario)}

/* Pase: tarjeta ------------------------------------------------------------------------------------- */
.lista{display:grid;gap:12px}
.tarjeta{position:relative;display:grid;gap:8px;text-align:left;padding:18px;border-radius:var(--kino-forma-radio-tarjeta);background:var(--kino-superficie-membrana);border:1px solid var(--kino-estado-vigente-borde);box-shadow:var(--kino-relieve-membrana);overflow:hidden;isolation:isolate;transition:transform var(--r-tacto-ms) var(--r-tacto),border-color var(--d-corto)}
.tarjeta:active{transform:scale(.98)}
.tarjeta--previsto{border-color:var(--kino-estado-previsto-borde)}
.tarjeta--sin-confirmar{border-style:dashed;border-color:var(--kino-estado-sin-confirmar-borde);background:var(--kino-superficie-elevada)}
.tarjeta--por-vencer{border-color:var(--kino-estado-por-vencer-borde)}
.tarjeta--vigente{box-shadow:var(--kino-resplandor-vigente),var(--kino-relieve-membrana)}
.tarjeta--vencido,.tarjeta--usado,.tarjeta--revocado{border-color:var(--kino-borde-tenue);opacity:.72;background:var(--kino-superficie-elevada);box-shadow:none}
.tarjeta__cabeza{display:flex;justify-content:space-between;align-items:center;gap:12px;min-width:0}
.tarjeta__cabeza .rotulo{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tarjeta__cabeza .chip{flex:none}
.tarjeta__motivo{font-size:14px;color:var(--kino-texto-secundario);margin-top:-4px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tarjeta__vigencia{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tarjeta__nombre{position:relative;font-weight:800;font-size:20px;justify-self:start}
.tachado,.corte{position:absolute;left:0;right:0;height:2px;transform:scaleX(0);transform-origin:left center;pointer-events:none}
.tachado{top:55%;background:var(--kino-estado-usado-texto)}
.tarjeta--usado .tachado,.detalle .portal--usado~* .tachado{transform:scaleX(1)}
.corte{top:50%;background:var(--kino-estado-revocado-texto);height:3px}
.tarjeta--revocado .corte,.portal--revocado .corte{transform:scaleX(1)}
.vida{height:5px;border-radius:3px;background:var(--kino-superficie-base);overflow:hidden}
.vida__fluido{display:block;height:100%;background:var(--kino-estado-vigente-texto);transform-origin:left center;transition:transform 1s linear}
.vida--por-vencer .vida__fluido{background:var(--kino-estado-por-vencer-texto)}
.vida--previsto .vida__fluido{background:var(--kino-estado-previsto-borde);opacity:.5}
.vida--sin-confirmar .vida__fluido{background:repeating-linear-gradient(90deg,var(--kino-borde-definido) 0 8px,transparent 8px 14px)}
.membrana{display:none}
/* Nacimiento: germinación. La tarjeta se hincha pareja y la vigencia crece por la punta, a pulsos. */
.tarjeta--nueva{animation:germina var(--d-tarjeta) var(--c-crecer) both}
.tarjeta--nueva .vida{animation:apical var(--d-tarjeta) var(--c-crecer) both;animation-delay:calc(var(--d-crecer) * .5)}
@keyframes germina{from{opacity:0;transform:scale(.94)}}
@keyframes apical{0%{clip-path:inset(0 100% 0 0)}28%,40%{clip-path:inset(0 66% 0 0)}62%,74%{clip-path:inset(0 33% 0 0)}100%{clip-path:inset(0 0 0 0)}}

/* Portal: el arco del logo con el QR --------------------------------------------------------------- */
.portal{position:relative;width:var(--tam);display:grid;place-items:center;isolation:isolate}
.portal__arco{position:relative;width:100%;aspect-ratio:1/1.08;border-radius:50% 50% 14px 14px / 46% 46% 14px 14px;background:#F4FFFA;color:#00140C;display:grid;place-items:center;padding-top:10%;box-shadow:0 0 0 2px var(--kino-estado-vigente-borde),var(--kino-resplandor-vigente);overflow:hidden;transition:box-shadow var(--d-tarjeta) var(--c-crecer),filter var(--d-decaer) var(--c-decaer)}
.portal__halo{position:absolute;inset:-12%;border-radius:50%;background:radial-gradient(closest-side,color-mix(in oklab,var(--kino-biolum-d110) 40%,transparent),transparent);z-index:-1;opacity:0;transition:opacity var(--d-tarjeta)}
.portal--vigente .portal__halo,.portal--por-vencer .portal__halo{opacity:var(--brillo,1)}
.portal--por-vencer .portal__arco{box-shadow:0 0 0 2px var(--kino-estado-por-vencer-borde)}
.portal--sin-confirmar .portal__arco{box-shadow:0 0 0 2px var(--kino-estado-sin-confirmar-borde);outline:2px dashed var(--kino-estado-sin-confirmar-borde);outline-offset:6px}
.portal--sin-confirmar .qr,.portal--previsto .qr{opacity:.35}
.portal--previsto .portal__arco{box-shadow:0 0 0 2px var(--kino-estado-previsto-borde)}
.portal--vencido .portal__arco,.portal--usado .portal__arco,.portal--revocado .portal__arco{filter:saturate(.2);box-shadow:0 0 0 2px var(--kino-borde-tenue)}
.portal--vencido .qr,.portal--usado .qr,.portal--revocado .qr{opacity:.12}
.portal__velo{position:absolute;inset:auto 0 30% 0;text-align:center;font-family:var(--kino-fuente-dato);font-size:20px;letter-spacing:.1em;text-transform:uppercase;color:#00140C}
.portal .corte{top:56%;left:8%;right:8%;height:4px;border-radius:2px}
.portal__dato{display:grid;gap:8px;text-align:center}
.portal__dato .rotulo{color:#3D5C50}
.portal__grande{font-family:var(--kino-fuente-dato);font-size:44px;font-weight:600;letter-spacing:.04em}

/* Residente ----------------------------------------------------------------------------------------- */
.ingreso{position:absolute;inset:0;display:flex;flex-direction:column;padding:24px;gap:28px;overflow:hidden;background:radial-gradient(120% 70% at 30% 0%,var(--kino-sustrato-400),var(--kino-superficie-abismo))}
.micelio--ingreso{opacity:.9}
.ingreso__marca{display:flex;align-items:center;gap:14px;margin-top:60px;position:relative}
.ingreso__logotipo{font-family:var(--kino-fuente-display);font-weight:900;font-size:40px;letter-spacing:.02em;font-stretch:125%}
.ingreso__cuerpo{position:relative;display:grid;gap:16px;margin-top:auto;margin-bottom:24px}
.ingreso__bienvenida{margin-bottom:auto;margin-top:40px}
.otp{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;cursor:text}
.otp__celda{height:62px;border-radius:12px;border:1px solid var(--kino-borde-definido);display:grid;place-items:center;font-family:var(--kino-fuente-dato);font-size:28px;background:var(--kino-superficie-base);transition:border-color var(--d-corto),transform var(--r-tacto-ms) var(--r-tacto)}
.otp__celda--llena{border-color:var(--kino-estado-vigente-borde);transform:translateY(-2px)}
.otp__celda--foco{border-color:var(--kino-texto-primario)}
.otp__entrada{position:absolute;opacity:0;pointer-events:none;height:1px}
.notificacion{position:absolute;top:8px;left:10px;right:10px;z-index:20;display:grid;gap:2px;text-align:left;padding:14px 16px;border-radius:22px;background:color-mix(in oklab,var(--kino-hueso-100) 92%,transparent);color:#0b1712;box-shadow:0 20px 40px -10px #000a;backdrop-filter:blur(10px);animation:cae var(--r-hoja-ms) var(--r-hoja) both}
.notificacion__app{font-size:12px;color:#516a60}
.notificacion__accion{font-size:13px;font-weight:700;color:#007a55;margin-top:4px}
@keyframes cae{from{transform:translateY(-130%)}}
.inicio,.detalle{position:absolute;inset:0;display:flex;flex-direction:column}
.cabecera{position:relative;padding:12px 20px 22px;display:grid;gap:14px;overflow:hidden}
.aurora{position:absolute;inset:-40% -20% 0;background:radial-gradient(60% 50% at 20% 30%,color-mix(in oklab,var(--kino-violeta-d45) 55%,transparent),transparent),radial-gradient(50% 60% at 80% 10%,color-mix(in oklab,var(--kino-biolum-d45) 60%,transparent),transparent);z-index:-1;filter:blur(10px)}
.micelio--cabecera{opacity:0}
.cabecera__fila{display:flex;justify-content:space-between;align-items:center}
.resumen-casa{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:0}
.resumen-casa div{display:grid;gap:2px;padding:12px;border-radius:12px;background:color-mix(in oklab,var(--kino-superficie-elevada) 70%,transparent);border:1px solid var(--kino-borde-tenue)}
.resumen-casa dd{margin:0;font-size:24px;line-height:1}
.resumen-casa dt{font-size:13px;color:var(--kino-texto-secundario)}
.seccion{padding:8px 20px 16px;display:grid;gap:12px}
.recientes{display:flex;gap:16px;padding:4px;margin:-4px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.reciente{display:grid;justify-items:center;gap:6px;font-size:13px;color:var(--kino-texto-secundario);flex:none}
.reciente:active .iniciales{transform:scale(.9)}
.iniciales{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:18px;background:var(--kino-superficie-membrana);border:1px solid var(--kino-borde-definido);color:var(--kino-texto-primario);transition:transform var(--r-tacto-ms) var(--r-tacto)}
.iniciales.colaborador{border-color:var(--kino-estado-previsto-borde)}
.pie-accion{position:absolute;left:0;right:0;padding:12px 20px;z-index:3;background:var(--kino-superficie-abismo);border-top:1px solid var(--kino-borde-tenue)}
.pie-accion--sobre-barra{bottom:78px;border-top:0;background:linear-gradient(color-mix(in oklab,var(--kino-superficie-abismo) 0%,transparent),var(--kino-superficie-abismo) 24px)}
.pie-accion--fijo{bottom:0;padding-bottom:24px}
.relleno-pie{height:168px}
.barra-inferior{position:absolute;bottom:0;left:0;right:0;height:78px;display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--kino-borde-tenue);background:var(--kino-superficie-abismo);padding-bottom:12px;z-index:4}
.barra-inferior__item{position:relative;display:grid;justify-items:center;align-content:center;gap:2px;font-size:12px;color:var(--kino-texto-tenue)}
.barra-inferior__item.activo{color:var(--kino-texto-primario);font-weight:700}
.punto-aviso{position:absolute;top:12px;left:calc(50% + 8px);width:9px;height:9px;border-radius:50%;background:var(--kino-acento-base)}
.pagina{padding:12px 20px 120px;display:grid;gap:16px;align-content:start}
.pagina__cabeza{display:grid;gap:8px}
.vacio{display:grid;gap:10px;padding:20px;border-radius:var(--kino-forma-radio-tarjeta);border:1px dashed var(--kino-borde-definido)}
.vacio--ilustrado{border:0;padding:24px 16px;text-align:center;justify-items:center;gap:16px}
.fila-aviso{display:flex;gap:12px;align-items:flex-start;text-align:left;padding:14px;border-radius:14px;background:var(--kino-superficie-elevada);border-left:3px solid var(--kino-estado-vigente-borde);animation:entra var(--d-crecer) var(--c-crecer) both}
.fila-aviso__texto{display:grid;gap:4px;min-width:0}
.fila-aviso--rechazado{border-left-color:var(--kino-estado-rechazado-borde)}
.banner{position:absolute;top:6px;left:10px;right:10px;z-index:30;display:flex;gap:12px;align-items:center;text-align:left;padding:14px 16px;border-radius:22px;background:var(--kino-superficie-membrana);border:1px solid var(--kino-estado-vigente-borde);box-shadow:var(--kino-resplandor-vigente),0 24px 50px -16px #000;animation:cae var(--r-hoja-ms) var(--r-hoja) both}
.banner>span{display:grid;gap:2px}
.banner--rechazado{border-color:var(--kino-estado-rechazado-borde);box-shadow:0 24px 50px -16px #000}
.capa{position:absolute;inset:0;z-index:10}
.capa__fondo{position:absolute;inset:0;background:#000a}
.hoja{position:absolute;left:0;right:0;bottom:0;max-height:94%;display:flex;flex-direction:column;border-radius:28px 28px 0 0;background:var(--kino-superficie-base);border-top:1px solid var(--kino-borde-definido);will-change:transform}
.hoja__asa{padding:8px 20px 6px;touch-action:none;cursor:grab}
.hoja__asa>i{display:block;width:44px;height:5px;border-radius:3px;background:var(--kino-borde-definido);margin:0 auto 6px}
.hoja__titulo{display:flex;justify-content:space-between;align-items:center}
.hoja__cuerpo{flex:1;overflow-y:auto;padding:4px 20px 20px;display:grid;gap:14px;align-content:start;scrollbar-width:none}
.hoja__pie{padding:12px 20px 26px;border-top:1px solid var(--kino-borde-tenue)}
.creado{justify-items:center;text-align:center;gap:16px}
.creado__portal{padding-top:16px}
.creado__texto{display:grid;gap:8px;justify-items:center}
.creado__acciones{display:grid;gap:8px;width:100%;margin-top:8px}
.barra-sup{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;padding:4px 12px;flex:none;text-align:center}
.barra-sup__hueco{width:44px}
.detalle .pantalla__scroll{padding-bottom:112px}
.detalle__portal{display:grid;justify-items:center;gap:16px;padding:8px 20px 24px}
.detalle__portal .modos{max-width:320px}
.detalle__cuerpo{display:grid;gap:16px;padding:0 20px}
.detalle__cabeza{display:grid;gap:8px;justify-items:start}
.detalle__cabeza h1{position:relative}
.cuenta{display:flex;align-items:baseline;gap:10px;margin:0}
.cuenta__num{font-size:30px;color:var(--kino-estado-vigente-texto)}
.traza{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.traza__item{display:grid;grid-template-columns:56px 1fr;gap:12px;font-size:14px;position:relative;animation:entra var(--d-crecer) var(--c-crecer) both}
.traza__item .mono{color:var(--kino-texto-secundario)}
.traza__item--entro span:last-child,.traza__item--confirmado span:last-child{color:var(--kino-estado-vigente-texto)}
.traza__item--rechazado span:last-child,.traza__item--revocado span:last-child{color:var(--kino-estado-rechazado-texto)}
.mantener{position:relative;overflow:hidden;width:100%;min-height:58px;border-radius:var(--kino-forma-radio-control);border:1px solid var(--kino-estado-rechazado-borde);color:var(--kino-estado-rechazado-texto);font-weight:700;touch-action:none;user-select:none}
.mantener__relleno{position:absolute;inset:0;background:var(--kino-estado-rechazado-fondo);transform:scaleX(0);transform-origin:left}
.mantener--cargando .mantener__relleno{transform:scaleX(1);transition:transform var(--ms) linear}
.mantener__texto{position:relative}
.deshacer{position:absolute;left:16px;right:16px;bottom:96px;z-index:40;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 12px 12px 16px;border-radius:16px;background:var(--kino-texto-primario);color:var(--kino-superficie-abismo);font-size:14px;font-weight:600;animation:sube var(--r-hoja-ms) var(--r-hoja) both}
.deshacer button{display:flex;gap:6px;align-items:center;padding:8px 12px;border-radius:10px;background:var(--kino-superficie-abismo);color:var(--kino-texto-primario);font-weight:700;white-space:nowrap}
@keyframes sube{from{transform:translateY(140%)}}

/* Visita --------------------------------------------------------------------------------------------- */
.app--visita{background:var(--kino-superficie-base);color:var(--kino-texto-primario)}
.chat{position:absolute;inset:0;display:flex;flex-direction:column;background:#E9EFEC}
.chat__cabeza{display:flex;align-items:center;gap:10px;padding:10px 14px;background:#F6FAF8;border-bottom:1px solid #d6e1dc;color:#0b1712}
.chat__cabeza>span:last-child{display:grid;font-size:14px}
.chat__avatar{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:#cfe3da;font-weight:800;font-size:14px}
.chat__cuerpo{flex:1;padding:16px 12px;display:grid;gap:8px;align-content:start;overflow:auto}
.burbuja{max-width:82%;padding:10px 12px 18px;border-radius:14px;background:#fff;color:#0b1712;position:relative;text-align:left;font-size:15px;box-shadow:0 1px 1px #0001;animation:entra var(--d-crecer) var(--c-crecer) both}
.burbuja__hora{position:absolute;right:12px;bottom:4px;font-size:12px;color:#5d726a}
.burbuja--pase{display:grid;gap:8px;padding:6px 6px 22px}
.burbuja--sistema{justify-self:center;background:#fff4e5;font-size:14px;padding:10px 12px}
.imagen-pase{display:grid;gap:6px;padding:14px;border-radius:10px;background:radial-gradient(120% 80% at 80% 0%,#0b3a2a,#00140C);color:#EFFCF7}
.imagen-pase .rotulo{color:#A5C7B8;font-size:12px}
.imagen-pase__cabeza{display:flex;justify-content:space-between;align-items:center}
.imagen-pase__arco{display:grid;place-items:end center;height:124px;margin:6px 40px;padding-bottom:10px;border-radius:50% 50% 8px 8px / 60% 60% 8px 8px;background:#F4FFFA;color:#00140C;box-shadow:0 0 18px 4px #00BB8366}
.imagen-pase .mono{font-size:12px;color:#7EF0C3}
.enlace-chat{display:flex;gap:6px;align-items:center;color:#027eb5;font-size:14px;padding:0 6px}
.chat__pie{margin:10px;padding:14px 18px;border-radius:24px;background:#fff;color:#8a9a94;font-size:15px}
.pase-vivo{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--kino-superficie-base);color:var(--kino-texto-primario)}
.navegador{display:flex;align-items:center;gap:6px;padding:6px 12px}
.navegador__url{flex:1;text-align:center;font-size:14px;padding:9px;border-radius:999px;background:var(--kino-superficie-elevada);color:var(--kino-texto-secundario)}
.pase-vivo__cuerpo{padding:12px 20px 24px;display:grid;gap:12px;align-content:start}
.pase-vivo__cuerpo .modos{max-width:320px;justify-self:center}
.pase-vivo__fila{display:flex;justify-content:space-between;align-items:center}
.pase-vivo__portal{display:grid;justify-items:center;padding:14px 0}
.portal--claro .portal__arco{background:#fff}
.instruccion{font-size:17px;text-align:center;margin:6px 0;font-weight:600}
.pase-vivo__pie{display:flex;gap:8px;align-items:center;justify-content:center;font-size:13px;color:var(--kino-texto-tenue);border-top:1px solid var(--kino-borde-tenue);padding-top:14px;margin-top:8px}

/* Portería ------------------------------------------------------------------------------------------- */
/* Retícula de 1080 × 760: cabecera 64 · cuerpo con panel del lector arriba y bitácora abajo · columna de llegadas de 312. */
.app--porteria{background:var(--kino-superficie-abismo)}
.porteria__cabeza{display:flex;align-items:center;gap:16px;height:64px;padding:0 24px;border-bottom:1px solid var(--kino-borde-tenue);font-size:18px;flex:none}
.porteria__hora{margin-left:auto;font-size:24px}
.porteria__cuerpo{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 312px;gap:24px;padding:24px}
.porteria__principal{display:grid;grid-template-rows:minmax(0,1fr) auto;gap:24px;min-width:0;min-height:0}
.lector{position:relative;isolation:isolate;overflow:hidden;display:grid;grid-template-columns:minmax(0,1fr) 200px;grid-template-rows:minmax(0,1fr) auto;border-radius:24px;border:2px solid var(--kino-borde-tenue);background:var(--kino-superficie-elevada);transition:border-color var(--d-crecer) var(--c-crecer)}
.lector--leyendo{border-color:var(--kino-estado-por-vencer-borde)}
/* El color del veredicto está en el primer cuadro; el destello solo explica de dónde vino. */
.lector--entra{border-color:var(--kino-estado-vigente-borde);background:var(--kino-estado-vigente-fondo)}
.lector--rechazado{border-color:var(--kino-estado-rechazado-borde);background:var(--kino-estado-rechazado-fondo)}
.lector__ola{position:absolute;inset:0;z-index:-1;opacity:0;pointer-events:none}
.lector--entra .lector__ola{background:radial-gradient(70% 90% at 86% 52%,color-mix(in oklab,var(--kino-biolum-d45) 60%,transparent),transparent 70%)}
.lector__contenido{grid-area:1/1;display:flex;align-items:center;padding:24px 32px;min-width:0;min-height:0}
.lector__texto{display:grid;gap:12px;width:100%;align-content:center}
.lector__titulo{font-family:var(--kino-fuente-display);font-weight:800;font-stretch:112%;font-size:36px;line-height:1.05}
.veredicto{display:flex;align-items:center;gap:16px;font-family:var(--kino-fuente-display);font-weight:900;font-stretch:112%;font-size:48px;line-height:1;white-space:nowrap}
.veredicto__icono{width:52px;height:52px;flex:none;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.veredicto__trazo{stroke-dasharray:1;stroke-dashoffset:0}
.lector--entra .veredicto{color:var(--kino-estado-vigente-texto)}
.lector--rechazado .veredicto{color:var(--kino-estado-rechazado-texto)}
.lector__motivo{font-size:20px;line-height:1.3;color:var(--kino-estado-rechazado-texto)}
.lector__datos{grid-area:2/1/3/3;display:grid;grid-template-columns:minmax(0,.7fr) minmax(0,1fr) minmax(0,.5fr) minmax(0,1.8fr);gap:16px;margin:0;padding:16px 32px;border-top:1px solid color-mix(in oklab,var(--kino-texto-primario) 14%,transparent);background:color-mix(in oklab,var(--kino-superficie-abismo) 28%,transparent)}
.lector__datos div{display:grid;gap:4px;min-width:0}
.lector__datos dt{font-family:var(--kino-fuente-dato);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--kino-texto-secundario)}
.lector__datos dd{margin:0;font-size:18px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lector__llamar{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-top:8px}
.lector__llamar .secundario-btn{width:auto}
.llamando{font-weight:700;animation:latir 1.4s infinite}
.puntos{display:flex;gap:8px}
.puntos i{width:10px;height:10px;border-radius:50%;background:var(--kino-estado-por-vencer-texto);animation:latir 1.2s var(--c-latir) infinite}
.puntos i:nth-child(2){animation-delay:.15s}.puntos i:nth-child(3){animation-delay:.3s}
.lector__escena{grid-area:1/2;position:relative;display:grid;grid-template-rows:1fr auto;align-items:end;padding:24px 24px 16px 0;min-height:0}
.puerta{width:100%;height:auto;overflow:visible}
.puerta__piso{fill:var(--kino-borde-tenue)}
.puerta__poste{fill:var(--kino-superficie-membrana);stroke:var(--kino-borde-definido);stroke-width:1.5}
.puerta__ventana{fill:var(--kino-superficie-abismo);stroke:var(--kino-borde-tenue)}
.puerta__barrido{fill:var(--kino-estado-por-vencer-texto);animation:barrer-ventana .8s var(--c-crecer) infinite alternate}
@keyframes barrer-ventana{to{transform:translateY(16px)}}
.puerta__luz{fill:var(--kino-estado-rechazado-texto);transition:fill var(--d-corto)}
.lector--leyendo .puerta__luz{fill:var(--kino-estado-por-vencer-texto);animation:latir .6s infinite}
.lector--entra .puerta__luz{fill:var(--kino-estado-vigente-texto);filter:drop-shadow(0 0 6px var(--kino-biolum-d110))}
.puerta__brazo rect{fill:var(--kino-hueso-200)}
.puerta__brazo .puerta__franja{fill:var(--kino-carmin-a78)}
.lector__cuenta{display:grid;gap:8px;margin-top:12px}
.lector__cuenta-pista{display:block;height:4px;border-radius:2px;background:color-mix(in oklab,var(--kino-estado-vigente-texto) 20%,transparent);overflow:hidden}
.lector__cuenta-pista span{display:block;height:100%;background:var(--kino-estado-vigente-texto);transform-origin:left}
/* Sinapsis inmunológica: los anillos convergen en la ventana del lector y forman la diana. */
.diana__anillo{fill:none;stroke:var(--kino-estado-vigente-texto);stroke-width:1.6;opacity:0;transform-box:fill-box;transform-origin:center}
.diana__anillo:nth-child(2){stroke-opacity:.7}.diana__anillo:nth-child(3){stroke-opacity:.45}
.porteria__lateral{display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:12px;min-width:0;min-height:0}
.llegadas{display:grid;gap:8px;align-content:start;overflow-y:auto;padding-bottom:24px;scrollbar-width:none;-webkit-mask-image:linear-gradient(#000 calc(100% - 32px),transparent);mask-image:linear-gradient(#000 calc(100% - 32px),transparent)}
.llegada{display:flex;gap:12px;align-items:center;min-height:56px;text-align:left;padding:8px 12px;border-radius:12px;border:1px solid var(--kino-borde-tenue);background:var(--kino-superficie-elevada);transition:transform var(--r-tacto-ms) var(--r-tacto),border-color var(--d-corto)}
.llegada:hover{border-color:var(--kino-borde-definido)}
.llegada:active{transform:scale(.98)}
.llegada:disabled{opacity:.5}
.llegada__texto{display:grid;gap:2px;min-width:0}
.llegada__texto b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.llegada .tenue{font-size:13px}
.porteria__digitar{display:grid;gap:8px}
.teclado{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}
.teclado input{min-width:0;min-height:48px;border-radius:12px;border:1px solid var(--kino-borde-definido);background:var(--kino-superficie-base);padding:0 12px;font-size:20px}
.teclado .accion{width:auto;min-height:48px}
.bitacora{display:grid;gap:8px;min-width:0}
.bitacora__tabla{overflow:hidden;border-radius:16px;border:1px solid var(--kino-borde-tenue)}
.tabla{width:100%;border-collapse:collapse;table-layout:fixed;font-size:15px}
.tabla th{text-align:left;font-family:var(--kino-fuente-dato);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--kino-texto-tenue);font-weight:500;padding:8px 12px;background:var(--kino-superficie-base)}
.tabla td{padding:8px 12px;border-top:1px solid var(--kino-borde-tenue);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;height:44px}
.tabla td.tabla__motivo{color:var(--kino-texto-secundario);white-space:normal;line-height:1.3}
.tabla tr.nueva td{animation:resalta 2s var(--c-decaer)}
@keyframes resalta{from{background:var(--kino-superficie-membrana)}}

/* Administración ------------------------------------------------------------------------------------ */
.app--admin{flex-direction:row}
.admin__menu{width:256px;flex:none;padding:24px 16px;display:flex;flex-direction:column;gap:24px;border-right:1px solid var(--kino-borde-tenue)}
.admin__marca{display:flex;gap:12px;align-items:center;font-size:17px;padding:0 8px}
.admin__nav{display:grid;gap:4px}
.admin__item{display:flex;gap:12px;align-items:center;min-height:48px;padding:0 12px;border-radius:12px;font-size:16px;color:var(--kino-texto-secundario);text-align:left}
.admin__item.activo{background:var(--kino-superficie-membrana);color:var(--kino-texto-primario);font-weight:700}
.admin__nota{margin-top:auto;padding:0 8px}
.admin__principal{flex:1;overflow:auto;min-width:0}
.admin__pagina{padding:32px 40px;display:grid;gap:24px;align-content:start;max-width:1000px}
.admin__cabeza{display:grid;gap:8px}
.alerta-sync{display:flex;gap:16px;align-items:center;text-align:left;padding:16px 24px;border-radius:16px;background:var(--kino-estado-rechazado-fondo);border:1px solid var(--kino-estado-rechazado-borde);color:var(--kino-estado-rechazado-texto)}
.alerta-sync__texto{display:grid;gap:4px;flex:1;min-width:0}
.alerta-sync b{color:var(--kino-texto-primario);font-size:17px}
.cifras{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.cifra{display:grid;gap:8px;padding:16px 24px;border-radius:16px;background:var(--kino-superficie-elevada);border:1px solid var(--kino-borde-tenue)}
.cifra__num{font-family:var(--kino-fuente-dato);font-size:44px;line-height:1}
.admin__columnas{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}
.tabla--admin td,.tabla--admin th{padding-left:0;background:none}
.tabla--admin td:last-child{white-space:normal}
.franjas{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.franja{gap:16px;align-content:start}
.franja__cabeza{display:grid;gap:4px}
.franja__controles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.admin__guardar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:stretch}
.admin__guardar .accion{align-self:center}
.previa{display:grid;gap:4px;padding:16px 24px;border-radius:14px;border:1px solid var(--kino-estado-vigente-borde);background:var(--kino-estado-vigente-fondo)}
.previa--choca{border-color:var(--kino-estado-por-vencer-borde);background:var(--kino-estado-por-vencer-fondo)}
.sync-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.sync{display:grid;gap:16px;align-content:start;padding:24px;border-radius:16px;background:var(--kino-superficie-elevada);border:1px solid var(--kino-borde-tenue)}
.sync--caida{border-color:var(--kino-estado-rechazado-borde)}
.sync__cabeza{display:flex;justify-content:space-between;align-items:center;font-size:18px}
.sync__barra{height:8px;border-radius:4px;background:var(--kino-superficie-base);overflow:hidden}
.sync__barra i{display:block;height:100%;background:var(--kino-estado-vigente-texto);transform-origin:left;transition:transform .1s linear}
.causa{margin:0;font-size:15px;color:var(--kino-texto-secundario)}
.red{width:100%;height:auto;overflow:visible}
.red__tubo path{fill:none;stroke:var(--kino-estado-vigente-texto);stroke-linecap:round;transition:stroke-width var(--d-crecer) var(--c-crecer),stroke var(--d-corto)}
.red__tubo--parcial path{stroke:var(--kino-estado-por-vencer-texto)}
.red__tubo--seco path{stroke:var(--kino-estado-rechazado-texto);stroke-dasharray:2 6}
.red__tubo text{font-family:var(--kino-fuente-dato);font-size:12px;fill:var(--kino-texto-secundario)}
.red__nodo{fill:var(--kino-superficie-membrana);stroke:var(--kino-borde-definido);stroke-width:1.5}
.red__rotulo{font-family:var(--kino-fuente-dato);font-size:12px;fill:var(--kino-texto-primario)}
.red__rotulo--tenue{fill:var(--kino-texto-secundario)}

/* Dirección biopunk (E3-1, aprobada). Movimiento según entrega-3/motion-e-ilustracion.md: nada se mueve si no cambia un dato. */
:root{--bio-filamento:#00D595;--bio-quitina:conic-gradient(from var(--giro,0deg),var(--kino-biolum-d110),var(--kino-indigo-d110),var(--kino-violeta-d110),var(--kino-biolum-d70),var(--kino-biolum-d110))}
@property --giro{syntax:'<angle>';inherits:false;initial-value:0deg}
[data-bio="1"] .titulo--xl,[data-bio="1"] .titulo--l{font-stretch:125%}
[data-bio="1"] .micelio--cabecera{opacity:.7}
[data-bio="1"] .tarjeta{border-radius:24px 18px 26px 16px}
[data-bio="1"] .tarjeta .membrana{display:block;position:absolute;inset:-30%;z-index:-1;background:radial-gradient(40% 50% at 30% 40%,color-mix(in oklab,var(--kino-biolum-d45) 50%,transparent),transparent 70%);opacity:calc(.55 * var(--brillo,1))}
[data-bio="1"] .tarjeta--vigente{box-shadow:0 0 0 1px var(--kino-biolum-d70),0 0 32px -8px var(--kino-biolum-d110),var(--kino-relieve-membrana)}
/* Por vencer: la bioluminiscencia se fatiga; el brillo baja con el tiempo que queda. */
[data-bio="1"] .tarjeta--por-vencer{box-shadow:0 0 0 1px color-mix(in oklab,var(--kino-ambar-d110) calc(var(--brillo,1) * 100%),transparent),0 0 30px -8px color-mix(in oklab,var(--kino-ambar-d110) calc(var(--brillo,1) * 100%),transparent),var(--kino-relieve-membrana)}
[data-bio="1"] .tarjeta--vencido{border-radius:30px 12px 34px 10px;filter:saturate(.25) sepia(.3) brightness(.9);transform:scale(.985)}
[data-bio="1"] .tarjeta--vencido .membrana,[data-bio="1"] .tarjeta--usado .membrana,[data-bio="1"] .tarjeta--revocado .membrana{display:none}
[data-bio="1"] .corte{height:4px;background:repeating-linear-gradient(90deg,var(--kino-estado-revocado-texto) 0 10px,transparent 10px 14px);filter:drop-shadow(0 0 4px var(--kino-carmin-d110))}
[data-bio="1"] .vida{height:7px;border-radius:4px}
[data-bio="1"] .vida--vigente .vida__fluido,[data-bio="1"] .vida--por-vencer .vida__fluido{background:linear-gradient(90deg,var(--kino-biolum-d45),var(--kino-estado-vigente-texto),var(--kino-biolum-d45)) 0 0/60px 100%;border-radius:4px;box-shadow:0 0 10px var(--kino-biolum-d110)}
[data-bio="1"] .vida--por-vencer .vida__fluido{background:linear-gradient(90deg,var(--kino-ambar-d110),var(--kino-estado-por-vencer-texto),var(--kino-ambar-d110)) 0 0/60px 100%}
[data-bio="1"] .portal__arco{box-shadow:none}
[data-bio="1"] .portal--vigente .portal__arco::before,[data-bio="1"] .portal--por-vencer .portal__arco::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:4px;background:var(--bio-quitina);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;opacity:var(--brillo,1)}
[data-bio="1"] .portal--vigente .portal__halo{background:radial-gradient(closest-side,color-mix(in oklab,var(--kino-biolum-d110) 60%,transparent),color-mix(in oklab,var(--kino-violeta-d45) 30%,transparent) 60%,transparent)}
[data-bio="1"] .portal--vencido .portal__arco{border-radius:44% 56% 20px 12px / 40% 50% 20px 12px;filter:saturate(0) contrast(.8)}
[data-bio="1"] .accion--crear{background:radial-gradient(120% 140% at 30% 0%,#3dffb8,#00D595 50%,#00a874);box-shadow:0 0 0 1px #00ffaa55,0 10px 30px -10px #00D595}
[data-bio="1"] .accion--crear[aria-disabled="true"]{background:var(--kino-superficie-membrana);box-shadow:none}
[data-bio="1"] .iniciales{border-radius:48% 52% 45% 55%/55% 45% 55% 45%}

/* Movimiento reducido ------------------------------------------------------------------------------- */
/* Reducido no es apagado: lo que aparece se funde en 240 ms o menos; lo que late o barre se queda quieto;
   las transiciones de color siguen, las de forma no. Las animaciones WAAPI se adaptan en movimiento.ts. */
@keyframes fundido{from{opacity:0}}
@media (prefers-reduced-motion:reduce){
	.entra,.nota-interaccion,.traza__item,.burbuja,.fila-aviso,.notificacion,.banner,.deshacer,.tabla tr.nueva td,.tarjeta--nueva{animation:fundido var(--d-corto) linear both!important}
	.tarjeta--nueva .vida,.puntos i,.llamando,.puerta__barrido,.lector--leyendo .puerta__luz{animation:none!important}
	*,*::before,*::after{transition-property:color,background-color,border-color,opacity,box-shadow!important}
}
[data-reducido="1"] :is(.entra,.nota-interaccion,.traza__item,.burbuja,.fila-aviso,.notificacion,.banner,.deshacer,.tabla tr.nueva td,.tarjeta--nueva){animation:fundido var(--d-corto) linear both!important}
[data-reducido="1"] :is(.tarjeta--nueva .vida,.puntos i,.llamando,.puerta__barrido,.lector--leyendo .puerta__luz){animation:none!important}
[data-reducido="1"] *,[data-reducido="1"] *::before,[data-reducido="1"] *::after{transition-property:color,background-color,border-color,opacity,box-shadow!important}

/* Ilustraciones: una familia con el arco y la gota del logo; trazo 1,7 de puntas redondas, dos colores apagados. */
.ilustracion{width:148px;height:auto;justify-self:center;overflow:visible}
.ilustracion__trazo{fill:none;stroke:var(--kino-texto-secundario);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.ilustracion__trazo--tenue{stroke:var(--kino-borde-definido)}
.ilustracion__trazo--punteado{stroke-dasharray:2 6}
.ilustracion__gota{fill:color-mix(in oklab,var(--kino-marca-gota) 70%,var(--kino-superficie-base))}
.ilustracion__gota--tenue{fill:none;stroke:var(--kino-borde-definido);stroke-width:3.4;stroke-dasharray:4 8}

/* Pantallas pequeñas: el prototipo se usa como app a pantalla completa ------------------------------- */
@media (max-width:820px){
	.escenario{grid-template-columns:minmax(0,1fr);height:auto;min-height:100vh;overflow-x:hidden}
	.escenario__marca .tenue{display:none}
	.reloj{max-width:100%}
	.notas{grid-column:1}
	.notas{border-left:0;border-top:1px solid var(--kino-borde-tenue)}
	.escenario__cabeza{padding:12px 16px;gap:10px}
	.actores{margin:0;overflow-x:auto;flex-wrap:nowrap;max-width:100%}
	.actores button{white-space:nowrap;font-size:14px;padding:8px 12px}
	.escenario__lienzo{flex-direction:column;padding:16px;align-items:stretch}
	.puesto--telefono,.puesto--tableta,.puesto--portatil{flex:none;height:min(844px,calc(100vh - 140px))}
	.puesto--tableta,.puesto--portatil{height:auto;aspect-ratio:1080/760}
}
