.accion{display:flex;align-items:center;justify-content:center;gap:10px;min-height:56px;padding:0 22px;border-radius:var(--kino-forma-radio-control);background:var(--kino-accion-fondo);color:var(--kino-accion-texto);font-weight:700;font-size:17px;width:100%;transition:transform var(--r-tacto-ms) var(--r-tacto),background var(--d-corto),opacity var(--d-corto)}

.chip-dato{font-size:13px;padding:5px 10px;border-radius:999px;border:1px solid var(--kino-borde-definido);color:var(--kino-texto-secundario)}

/* Pase: tarjeta ------------------------------------------------------------------------------------- */

/* Portería ------------------------------------------------------------------------------------------- */
/* Retícula de 1080 × 760: cabecera 64 · cuerpo con panel del lector arriba y bitácora abajo · columna de llegadas de 312. */
.app--porteria{background:var(--kino-superficie-abismo)}

/* Panel del lector: la escena 3D aprobada (M3D) a sangre, espejada; el texto vive sobre un velo que lleva el color
   del veredicto desde el primer cuadro. El cuadro de 16:9 cubre el panel sin deformarse (container queries). */
.lector{position:relative;isolation:isolate;overflow:hidden;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto;border-radius:24px;border:2px solid var(--kino-borde-tenue);background:#04100c;container-type:size;transition:border-color var(--d-crecer) var(--c-crecer)}
.lector--leyendo{border-color:var(--kino-estado-por-vencer-borde)}
.lector--entra{border-color:var(--kino-estado-vigente-borde)}
.lector--rechazado{border-color:var(--kino-estado-rechazado-borde)}
.lector__cine{position:absolute;inset:0;z-index:-1;overflow:hidden}
.lector__cuadro{position:absolute;left:50%;top:50%;width:max(100cqw,177.78cqh);aspect-ratio:16/9;translate:-50% -50%}
.lector__video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1);transition:filter var(--d-crecer) var(--c-crecer)}
.lector--rechazado .lector__video{filter:saturate(.35) brightness(.72)}
/* Velo: neutro en reposo y lectura; verde o carmín con el veredicto. Deja ver la escena a la derecha, donde está el lector. */
.lector__velo{position:absolute;inset:0;background:linear-gradient(90deg,color-mix(in oklab,#020a07 92%,transparent) 0%,color-mix(in oklab,#020a07 70%,transparent) 42%,transparent 72%);transition:background var(--d-corto)}
.lector--entra .lector__velo{background:linear-gradient(90deg,color-mix(in oklab,var(--kino-estado-vigente-fondo) 94%,transparent) 0%,color-mix(in oklab,var(--kino-estado-vigente-fondo) 78%,transparent) 42%,color-mix(in oklab,var(--kino-estado-vigente-fondo) 12%,transparent) 74%)}
.lector--rechazado .lector__velo{background:linear-gradient(90deg,color-mix(in oklab,var(--kino-estado-rechazado-fondo) 95%,transparent) 0%,color-mix(in oklab,var(--kino-estado-rechazado-fondo) 82%,transparent) 46%,color-mix(in oklab,var(--kino-estado-rechazado-fondo) 30%,transparent) 80%)}
.lector__luz{position:absolute;width:2.2%;aspect-ratio:1;border-radius:50%;translate:-50% -50%;opacity:0;background:radial-gradient(circle,#ffd9d4 0 18%,var(--kino-estado-rechazado-texto) 30%,color-mix(in oklab,var(--kino-carmin-d110) 60%,transparent) 55%,transparent 72%);filter:blur(.3px)}
.lector--rechazado .lector__luz{opacity:1}
/* Sinapsis inmunológica: tres anillos convergen sobre la luz real del lector cuando confirma. */
.diana{position:absolute;width:0;height:0}
.diana__anillo{position:absolute;left:0;top:0;width:3.4cqh;aspect-ratio:1;border-radius:50%;border:2px solid var(--kino-estado-vigente-texto);opacity:0;box-shadow:0 0 12px -2px var(--kino-biolum-d110)}
.diana__anillo:nth-child(2){width:6.4cqh;border-color:color-mix(in oklab,var(--kino-estado-vigente-texto) 70%,transparent)}
.diana__anillo:nth-child(3){width:9.6cqh;border-color:color-mix(in oklab,var(--kino-estado-vigente-texto) 45%,transparent)}
.lector__contenido{grid-area:1/1;display:flex;align-items:center;padding:28px 36px;min-width:0;min-height:0;max-width:72%}
.lector__texto{display:grid;gap:12px;width:100%;align-content:center}

.porteria__lateral{display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:12px;min-width:0;min-height:0}
.llegadas{display:grid;gap:8px;align-content:start;overflow-y:auto;padding-bottom:24px;scrollbar-width:none;-webkit-mask-image:linear-gradient(#000 calc(100% - 32px),transparent);mask-image:linear-gradient(#000 calc(100% - 32px),transparent)}

.red__cauce{stroke:var(--kino-borde-tenue)!important;stroke-width:12!important;stroke-dasharray:none!important;opacity:.35}
.red__alta{fill:#d8fff0;filter:drop-shadow(0 0 4px var(--kino-biolum-d110))}
.red--flujo .red__nodo{stroke:var(--kino-estado-vigente-borde)}
.red__tubo path{fill:none;stroke:var(--kino-estado-vigente-texto);stroke-linecap:round;transition:stroke-width var(--d-crecer) var(--c-crecer),stroke var(--d-corto)}
.red__tubo--parcial path{stroke:var(--kino-estado-por-vencer-texto)}
.red__tubo--seco path{stroke:var(--kino-estado-rechazado-texto);stroke-dasharray:2 6}

.red__rotulo--tenue{fill:var(--kino-texto-secundario)}

/* Dirección biopunk (E3-1, aprobada). Movimiento según entrega-3/motion-e-ilustracion.md: nada se mueve si no cambia un dato. */
:root{--bio-filamento:#00D595;--bio-quitina:conic-gradient(from var(--giro,0deg),var(--kino-biolum-d110),var(--kino-indigo-d110),var(--kino-violeta-d110),var(--kino-biolum-d70),var(--kino-biolum-d110))}
@property --giro{syntax:'<angle>';inherits:false;initial-value:0deg}
[data-bio="1"] .titulo--xl,[data-bio="1"] .titulo--l{font-stretch:125%}
[data-bio="1"] .micelio--cabecera{opacity:.7}
[data-bio="1"] .tarjeta{border-radius:24px 18px 26px 16px}
[data-bio="1"] .tarjeta .membrana{display:block;position:absolute;inset:-30%;z-index:-1;background:radial-gradient(40% 50% at 30% 40%,color-mix(in oklab,var(--kino-biolum-d45) 50%,transparent),transparent 70%);opacity:calc(.55 * var(--brillo,1))}
[data-bio="1"] .tarjeta--vigente{box-shadow:inset 3px 0 0 var(--kino-estado-vigente-texto),-12px 0 32px -18px var(--kino-biolum-d110),var(--kino-relieve-membrana)}
/* Por vencer: la bioluminiscencia se fatiga; el brillo baja con el tiempo que queda. */
[data-bio="1"] .tarjeta--por-vencer{box-shadow:inset 3px 0 0 color-mix(in oklab,var(--kino-estado-por-vencer-texto) calc(var(--brillo,1) * 100%),transparent),-12px 0 30px -18px color-mix(in oklab,var(--kino-ambar-d110) calc(var(--brillo,1) * 100%),transparent),var(--kino-relieve-membrana)}
[data-bio="1"] .tarjeta--vencido{border-radius:30px 12px 34px 10px;filter:saturate(.25) sepia(.3) brightness(.9);transform:scale(.985)}
[data-bio="1"] .tarjeta--vencido .membrana,[data-bio="1"] .tarjeta--usado .membrana,[data-bio="1"] .tarjeta--revocado .membrana{display:none}
[data-bio="1"] .corte{height:4px;background:repeating-linear-gradient(90deg,var(--kino-estado-revocado-texto) 0 10px,transparent 10px 14px);filter:drop-shadow(0 0 4px var(--kino-carmin-d110))}
[data-bio="1"] .vida{height:7px;border-radius:4px}
[data-bio="1"] .vida--vigente .vida__fluido,[data-bio="1"] .vida--por-vencer .vida__fluido{background:linear-gradient(90deg,var(--kino-biolum-d45),var(--kino-estado-vigente-texto),var(--kino-biolum-d45)) 0 0/60px 100%;border-radius:4px;box-shadow:0 0 10px var(--kino-biolum-d110)}
[data-bio="1"] .vida--por-vencer .vida__fluido{background:linear-gradient(90deg,var(--kino-ambar-d110),var(--kino-estado-por-vencer-texto),var(--kino-ambar-d110)) 0 0/60px 100%}
[data-bio="1"] .portal__arco{box-shadow:none}
[data-bio="1"] .portal--vigente .portal__arco::before,[data-bio="1"] .portal--por-vencer .portal__arco::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:4px;background:var(--bio-quitina);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;opacity:var(--brillo,1)}
[data-bio="1"] .portal--vigente .portal__halo{background:radial-gradient(closest-side,color-mix(in oklab,var(--kino-biolum-d110) 60%,transparent),color-mix(in oklab,var(--kino-violeta-d45) 30%,transparent) 60%,transparent)}
[data-bio="1"] .portal--vencido .portal__arco{border-radius:44% 56% 20px 12px / 40% 50% 20px 12px;filter:saturate(0) contrast(.8)}
[data-bio="1"] .accion--crear{background:radial-gradient(120% 140% at 30% 0%,#3dffb8,#00D595 50%,#00a874);box-shadow:0 0 0 1px #00ffaa55,0 10px 30px -10px #00D595}
[data-bio="1"] .accion--crear[aria-disabled="true"]{background:var(--kino-superficie-membrana);box-shadow:none}
[data-bio="1"] .iniciales{border-radius:48% 52% 45% 55%/55% 45% 55% 45%}

/* Movimiento reducido ------------------------------------------------------------------------------- */
/* Reducido no es apagado: lo que aparece se funde en 240 ms o menos; lo que late o barre se queda quieto;
   las transiciones de color siguen, las de forma no. Las animaciones WAAPI se adaptan en movimiento.ts. */
@keyframes fundido{from{opacity:0}}
@media (prefers-reduced-motion:reduce){
	.entra,.nota-interaccion,.traza__item,.burbuja,.fila-aviso--nueva,.notificacion,.banner,.deshacer,.tabla tr.nueva td,.tarjeta--nueva{animation:fundido var(--d-corto) linear both!important}
	.tarjeta--nueva .vida,.puntos i,.llamando{animation:none!important}
	*,*::before,*::after{transition-property:color,background-color,border-color,opacity,box-shadow!important}
}
[data-reducido="1"] :is(.entra,.nota-interaccion,.traza__item,.burbuja,.fila-aviso--nueva,.notificacion,.banner,.deshacer,.tabla tr.nueva td,.tarjeta--nueva){animation:fundido var(--d-corto) linear both!important}
[data-reducido="1"] :is(.tarjeta--nueva .vida,.puntos i,.llamando){animation:none!important}
[data-reducido="1"] *,[data-reducido="1"] *::before,[data-reducido="1"] *::after{transition-property:color,background-color,border-color,opacity,box-shadow!important}

/* Ilustraciones: una familia con el arco y la gota del logo; trazo 1,7 de puntas redondas, dos colores apagados. */
.ilustracion{width:148px;height:auto;justify-self:center;overflow:visible}
.ilustracion__trazo{fill:none;stroke:var(--kino-texto-secundario);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.ilustracion__trazo--tenue{stroke:var(--kino-borde-definido)}
.ilustracion__trazo--punteado{stroke-dasharray:2 6}
.ilustracion__trazo--borde{stroke:color-mix(in oklab,var(--kino-estado-vigente-borde) 55%,var(--kino-borde-definido))}
.ilustracion__brillo{fill:none;stroke:#ffffff30;stroke-width:2.4;stroke-linecap:round}
.ilustracion__gota{fill:color-mix(in oklab,var(--kino-marca-gota) 70%,var(--kino-superficie-base))}
.ilustracion__gota--tenue{fill:none;stroke:var(--kino-borde-definido);stroke-width:3.4;stroke-dasharray:4 8}

/* Pantallas pequeñas: el prototipo se usa como app a pantalla completa ------------------------------- */
@media (max-width:820px){
	.escenario{grid-template-columns:minmax(0,1fr);height:auto;min-height:100vh;overflow-x:hidden}
	.escenario__marca .tenue{display:none}
	.reloj{max-width:100%}
	.notas{grid-column:1}
	.notas{border-left:0;border-top:1px solid var(--kino-borde-tenue)}
	.escenario__cabeza{padding:12px 16px;gap:10px}
	.actores{margin:0;overflow-x:auto;flex-wrap:nowrap;max-width:100%}
	.actores button{white-space:nowrap;font-size:14px;padding:8px 12px}
	.escenario__lienzo{flex-direction:column;padding:16px;align-items:stretch}
	.puesto--telefono,.puesto--tableta,.puesto--portatil{flex:none;height:min(844px,calc(100vh - 140px))}
	.puesto--tableta,.puesto--portatil{height:auto;aspect-ratio:1080/760}
}

/* Continuidad en toda la app (tercera pasada) --------------------------------------------------------- */
/* Texto que cambia: el anterior se va y el nuevo llega en el mismo lugar. */
.fundir{display:inline-grid;vertical-align:baseline}
.fundir>span{grid-area:1/1}
.fundir__sale::before{content:attr(data-t)}
.fundir__sale{animation:fundir-sale calc(var(--d-corto) * .5) var(--c-salir) forwards}
.fundir__entra{animation:fundir-entra calc(var(--d-corto) * .65) var(--c-crecer) calc(var(--d-corto) * .3) both}
@keyframes fundir-sale{to{opacity:0;transform:translateY(-.25em)}}
@keyframes fundir-entra{from{opacity:0;transform:translateY(.3em)}}
.digitos{display:inline-flex;font-variant-numeric:tabular-nums}
.cifra-viva{font-variant-numeric:tabular-nums}

/* Relevo: el contenido nuevo entra de un lado y el anterior sale al otro, fuera del flujo. */
.pila{position:relative;display:grid;min-width:0}
.pila>*{min-width:0}
.relevo__entra{animation:relevo-entra var(--d-crecer) var(--c-crecer) calc(var(--d-corto) * .35) both}
.relevo__sale{position:absolute;left:0;right:0;top:0;pointer-events:none;animation:relevo-sale calc(var(--d-corto) * .5) var(--c-salir) forwards}
@keyframes relevo-entra{from{opacity:0;transform:translateX(calc(var(--dir,1) * 22px))}}
@keyframes relevo-sale{to{opacity:0;transform:translateX(calc(var(--dir,1) * -22px))}}

/* Lo que sale: la misma dirección por la que entró, al 60 % de su duración. */
.sale{pointer-events:none;animation:sale calc(var(--d-crecer) * .6) var(--c-salir) forwards!important}
@keyframes sale{to{opacity:0;transform:translateY(8px) scale(.98)}}
.notificacion.sale,.banner.sale{animation-name:sale-arriba!important}
@keyframes sale-arriba{to{opacity:.4;transform:translateY(-130%)}}
.deshacer.sale{animation-name:sale-abajo!important}
@keyframes sale-abajo{to{opacity:.4;transform:translateY(140%)}}

/* Indicador que se desliza al activo, con el resorte «pase». */
.con-indicador{position:relative;isolation:isolate}
.indicador{position:absolute;left:0;top:0;z-index:-1;width:var(--iw,0);height:var(--ih,0);transform:translate(var(--ix,0),var(--iy,0));border-radius:var(--kino-forma-radio-control);background:var(--kino-texto-primario);pointer-events:none}
[data-indicador="listo"]>.indicador{transition:transform var(--r-pase-ms) var(--r-pase),width var(--r-pase-ms) var(--r-pase),height var(--r-pase-ms) var(--r-pase)}
[data-sin-activo]>.indicador{opacity:0}
.con-indicador>.activo,.con-indicador>[aria-selected="true"],.con-indicador>[aria-checked="true"]{background:transparent!important;border-color:transparent!important}
.opciones.con-indicador>.indicador{border-radius:12px}
.modos.con-indicador>.indicador{background:none;border:1px solid var(--kino-texto-primario);border-radius:12px}
.barra-inferior.con-indicador>.indicador{top:-1px;height:2px;width:28px;border-radius:0 0 2px 2px;background:var(--kino-estado-vigente-texto);box-shadow:0 0 10px var(--kino-estado-vigente-texto);transform:translateX(calc(var(--ix,0) + var(--iw,0) / 2 - 14px))}

/* Botón flotante: brota con resorte al volver a Pases y se encoge al salir. */
.pie-accion--sobre-barra .accion{animation:brota var(--r-pase-ms) var(--r-pase) both}
.pie-accion--sobre-barra.sale{animation:none!important}
.pie-accion--sobre-barra.sale .accion{animation:encoge calc(var(--d-corto) * .6) var(--c-salir) forwards}
@keyframes brota{from{opacity:0;transform:scale(.6) translateY(16px)}}
@keyframes encoge{to{opacity:0;transform:scale(.6) translateY(16px)}}

/* Estados del Pase: el final lo fija la clase; las animaciones solo cuentan el cambio. */
@property --brillo{syntax:'<number>';inherits:true;initial-value:0}
.tarjeta,.portal{transition:--brillo var(--d-decaer) var(--c-decaer)}
.vida__fluido{transition:transform 1s linear,background-color var(--d-decaer) var(--c-decaer)}
.portal--vencido .portal__arco{filter:saturate(.35) sepia(.2)}
.portal .qr{transition:opacity var(--d-crecer) var(--c-crecer)}
.detalle--usado .detalle__cabeza .tachado{transform:scaleX(1)}
.detalle--revocado .detalle__cabeza .titulo,.detalle--vencido .detalle__cabeza .titulo,.detalle--usado .detalle__cabeza .titulo{color:var(--kino-texto-secundario);transition:color var(--d-decaer)}
.detalle__cabeza .titulo{position:relative}

/* Mantener para revocar: al completar, el botón se contrae como al cerrarse (Mimosa). */
.mantener--hecho{animation:contrae var(--d-decaer) var(--c-decaer)}
@keyframes contrae{12%{transform:scale(.97)}}

/* Lista de avisos: solo los nuevos entran. */
.fila-aviso{animation:none}
.fila-aviso--nueva{animation:entra var(--d-tarjeta) var(--c-crecer) both}

@media (prefers-reduced-motion:reduce){
	.fundir__sale,.fundir__entra,.relevo__entra,.relevo__sale,.pie-accion--sobre-barra .accion,.fila-aviso--nueva{animation-name:fundido!important;animation-duration:var(--d-corto)!important;transform:none!important}
	.fundir__sale,.relevo__sale,.sale,.pie-accion--sobre-barra.sale .accion{animation:sale-fundido var(--d-corto) linear forwards!important}
	.mantener--cargando .mantener__relleno{transition-property:transform!important}
}
[data-reducido="1"] :is(.fundir__sale,.fundir__entra,.relevo__entra,.relevo__sale,.pie-accion--sobre-barra .accion,.fila-aviso--nueva){animation-name:fundido!important;animation-duration:var(--d-corto)!important;transform:none!important}
[data-reducido="1"] :is(.fundir__sale,.relevo__sale,.sale,.pie-accion--sobre-barra.sale .accion){animation:sale-fundido var(--d-corto) linear forwards!important}
[data-reducido="1"] .mantener--cargando .mantener__relleno{transition-property:transform!important}
@keyframes sale-fundido{to{opacity:0}}
.ingreso__pasos{margin-top:auto}
.ingreso__pasos .ingreso__cuerpo{margin-top:0}
.otp__celda--llena{animation:celda var(--r-tacto-ms) var(--r-tacto)}
@keyframes celda{from{transform:scale(.86);border-color:var(--kino-estado-vigente-texto)}}
.icono-brota{display:inline-flex;animation:brota var(--r-pase-ms) var(--r-pase) both}
.previa-pase{transition:background-color var(--d-corto),border-color var(--d-corto)}
.previa-pase--choca{animation:contrae var(--d-decaer) var(--c-decaer)}
.portal__contenido{display:grid;place-items:center;grid-area:1/1}
.portal__contenido--cambia{animation:modo-entra var(--d-crecer) var(--c-crecer) both}
@keyframes modo-entra{from{opacity:0;transform:scale(.94)}}
.cuenta__num--destello{animation:destello calc(var(--d-crecer) * 1.5) var(--c-crecer)}
@keyframes destello{20%{filter:brightness(1.8);text-shadow:0 0 14px currentColor}}
/* Chat: cada burbuja nace de su cola, en cascada; al volver del Pase vivo ya estaban. */
.burbuja{animation-name:burbuja;transform-origin:0 100%}
.chat__cuerpo .burbuja:nth-child(2){animation-delay:90ms}
.chat__cuerpo .burbuja:nth-child(3){animation-delay:180ms}
@keyframes burbuja{from{opacity:0;transform:scale(.86) translateY(8px)}}
.burbuja--sistema{transform-origin:50% 100%;animation:burbuja var(--d-crecer) var(--c-crecer) both,aviso-carmin var(--d-decaer) var(--c-decaer) var(--d-crecer) both}
@keyframes aviso-carmin{from{background:#FED6D2}}
.chat--vuelta .burbuja:not(.burbuja--sistema){animation:none}
/* Portería: el texto del panel se releva; los latidos de la llamada son 3 y se detienen (WCAG 2.2.2). */
.lector__texto--entra{animation:fundir-entra var(--d-corto) var(--c-crecer) both}
.llamando{animation:latir 1.4s var(--c-latir) 3}
.llamando.entra{animation:entra var(--d-crecer) var(--c-crecer) both,latir 1.4s var(--c-latir) var(--d-crecer) 3}
.teclado{animation:teclado var(--r-hoja-ms) var(--r-hoja) both;transform-origin:50% 0}
@keyframes teclado{from{opacity:0;transform:translateY(-10px) scaleY(.9)}}
.llegada:disabled{opacity:.55}
.tabla tr.nueva td{animation:resalta 2s var(--c-decaer),fundido var(--d-crecer) var(--c-crecer)}
/* Administración: el indicador del menú viaja; la alerta y la vista previa responden al cambio. */
.admin__nav.con-indicador>.indicador{background:var(--kino-superficie-membrana);border-radius:12px}
.admin__nav.con-indicador>.activo{background:transparent!important}
.previa{transition:background-color var(--d-corto),border-color var(--d-corto)}
.previa--choca{animation:contrae var(--d-decaer) var(--c-decaer)}
.sync .chip{animation:fundido var(--d-corto) var(--c-crecer)}
.accion .fundir,.secundario-btn .fundir{justify-items:center}
/* Escenario: el actor activo lleva un indicador que viaja; el panel de notas entra y sale por su borde. */
.actores.con-indicador>.indicador{border-radius:999px}
.notas{animation:notas-entra var(--d-tarjeta) var(--c-crecer) both}
.notas--sale{animation:notas-sale calc(var(--d-tarjeta) * .6) var(--c-salir) forwards;pointer-events:none}
@keyframes notas-entra{from{opacity:0;transform:translateX(40px)}}
@keyframes notas-sale{to{opacity:0;transform:translateX(40px)}}
/* Ilustraciones: un solo gesto al montar, con el mismo resorte del Pase; después quedan quietas. */
.ilustracion__gota-llega{transform-box:fill-box;transform-origin:50% 100%;animation:gota-llega var(--r-pase-ms) var(--r-pase) var(--d-corto) both}
@keyframes gota-llega{from{opacity:0;transform:translateY(46px) scale(.8)}}
.ilustracion__halo{animation:fundido var(--d-decaer) var(--c-decaer) calc(var(--d-corto) + var(--r-pase-ms) * .5) both}
.ilustracion--llegada .ilustracion__trazo--punteado{animation:rastro var(--d-tarjeta) var(--c-crecer) both}
@keyframes rastro{from{stroke-dashoffset:-24;opacity:0}}
.ilustracion__arco-nace{transform-box:fill-box;transform-origin:50% 100%;animation:arco-nace var(--d-tarjeta) var(--c-crecer) both}
@keyframes arco-nace{from{opacity:0;transform:scaleY(.86)}}
.ilustracion__gota-asienta{transform-box:fill-box;transform-origin:50% 100%;animation:gota-llega var(--r-pase-ms) var(--r-pase) calc(var(--d-corto) * .6) both}
@media (prefers-reduced-motion:reduce){.ilustracion *{animation-name:fundido!important;transform:none}}
[data-reducido="1"] .ilustracion *{animation-name:fundido!important}
/* Panel de notas: el lugar de cada interacción en el plan SOSTAC (Estrategia de Servicio). */
.nota-interaccion__plan{margin-top:16px!important;padding-top:14px;border-top:1px dashed var(--kino-borde-definido)}
.nota-interaccion__plan dt{color:var(--kino-estado-vigente-texto)!important}
.cobertura__oe{margin-left:6px;font-size:12px;color:var(--kino-texto-tenue)}

/* Aviso cuando la vista no permite pantalla completa. */
.aviso-pantalla{position:absolute;right:24px;top:calc(100% + 8px);max-width:min(420px,calc(100vw - 32px));margin:0;padding:10px 14px;border-radius:10px;background:var(--kino-superficie-membrana);border:1px solid var(--kino-borde-definido);color:var(--kino-texto-primario);font-size:14px;z-index:5}
.reloj .pantalla-completa{display:inline-grid;place-items:center;min-width:44px}
</style>
