.accion{display:flex;align-items:center;justify-content:center;gap:10px;min-height:56px;padding:0 22px;border-radius:var(--kino-forma-radio-control);background:var(--kino-accion-fondo);color:var(--kino-accion-texto);font-weight:700;font-size:17px;width:100%;transition:transform var(--r-tacto-ms) var(--r-tacto),background var(--d-corto),opacity var(--d-corto)}

.chip-dato{font-size:13px;padding:5px 10px;border-radius:999px;border:1px solid var(--kino-borde-definido);color:var(--kino-texto-secundario)}

/* Pase: tarjeta ------------------------------------------------------------------------------------- */

/* Portería ------------------------------------------------------------------------------------------- */
/* Retícula de 1080 × 760: cabecera 64 · cuerpo con panel del lector arriba y bitácora abajo · columna de llegadas de 312. */

/* Panel del lector: la escena 3D aprobada (M3D) a sangre, espejada; el texto vive sobre un velo que lleva el color
   del veredicto desde el primer cuadro. El cuadro de 16:9 cubre el panel sin deformarse (container queries). */
.lector{position:relative;isolation:isolate;overflow:hidden;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto;border-radius:24px;border:2px solid var(--kino-borde-tenue);background:#04100c;container-type:size;transition:border-color var(--d-crecer) var(--c-crecer)}
.lector--leyendo{border-color:var(--kino-estado-por-vencer-borde)}
.lector--entra{border-color:var(--kino-estado-vigente-borde)}
.lector--rechazado{border-color:var(--kino-estado-rechazado-borde)}
.lector__cine{position:absolute;inset:0;z-index:-1;overflow:hidden}
.lector__cuadro{position:absolute;left:50%;top:50%;width:max(100cqw,177.78cqh);aspect-ratio:16/9;translate:-50% -50%}
.lector__video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1);transition:filter var(--d-crecer) var(--c-crecer)}
.lector--rechazado .lector__video{filter:saturate(.35) brightness(.72)}
/* Velo: neutro en reposo y lectura; verde o carmín con el veredicto. Deja ver la escena a la derecha, donde está el lector. */
.lector__velo{position:absolute;inset:0;background:linear-gradient(90deg,color-mix(in oklab,#020a07 92%,transparent) 0%,color-mix(in oklab,#020a07 70%,transparent) 42%,transparent 72%);transition:background var(--d-corto)}
.lector--entra .lector__velo{background:linear-gradient(90deg,color-mix(in oklab,var(--kino-estado-vigente-fondo) 94%,transparent) 0%,color-mix(in oklab,var(--kino-estado-vigente-fondo) 78%,transparent) 42%,color-mix(in oklab,var(--kino-estado-vigente-fondo) 12%,transparent) 74%)}
.lector--rechazado .lector__velo{background:linear-gradient(90deg,color-mix(in oklab,var(--kino-estado-rechazado-fondo) 95%,transparent) 0%,color-mix(in oklab,var(--kino-estado-rechazado-fondo) 82%,transparent) 46%,color-mix(in oklab,var(--kino-estado-rechazado-fondo) 30%,transparent) 80%)}
.lector__luz{position:absolute;width:2.2%;aspect-ratio:1;border-radius:50%;translate:-50% -50%;opacity:0;background:radial-gradient(circle,#ffd9d4 0 18%,var(--kino-estado-rechazado-texto) 30%,color-mix(in oklab,var(--kino-carmin-d110) 60%,transparent) 55%,transparent 72%);filter:blur(.3px)}
.lector--rechazado .lector__luz{opacity:1}
/* Sinapsis inmunológica: tres anillos convergen sobre la luz real del lector cuando confirma. */
.diana{position:absolute;width:0;height:0}
.diana__anillo{position:absolute;left:0;top:0;width:3.4cqh;aspect-ratio:1;border-radius:50%;border:2px solid var(--kino-estado-vigente-texto);opacity:0;box-shadow:0 0 12px -2px var(--kino-biolum-d110)}
.diana__anillo:nth-child(2){width:6.4cqh;border-color:color-mix(in oklab,var(--kino-estado-vigente-texto) 70%,transparent)}
.diana__anillo:nth-child(3){width:9.6cqh;border-color:color-mix(in oklab,var(--kino-estado-vigente-texto) 45%,transparent)}
.lector__contenido{grid-area:1/1;display:flex;align-items:center;padding:28px 36px;min-width:0;min-height:0;max-width:72%}
.lector__texto{display:grid;gap:12px;width:100%;align-content:center}
.lector__titulo{font-family:var(--kino-fuente-display);font-weight:800;font-stretch:112%;font-size:36px;line-height:1.05;text-shadow:0 1px 16px #0008}
.veredicto{display:flex;align-items:center;gap:16px;font-family:var(--kino-fuente-display);font-weight:900;font-stretch:112%;font-size:52px;line-height:1;white-space:nowrap}
.veredicto__icono{width:56px;height:56px;flex:none;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.veredicto__trazo{stroke-dasharray:1;stroke-dashoffset:0}
.lector--entra .veredicto{color:var(--kino-estado-vigente-texto)}
.lector--rechazado .veredicto{color:var(--kino-estado-rechazado-texto)}
.lector__motivo{font-size:20px;line-height:1.3;color:var(--kino-estado-rechazado-texto)}
.lector__datos{grid-area:2/1;display:grid;grid-template-columns:minmax(0,.7fr) minmax(0,1fr) minmax(0,.5fr) minmax(0,1.8fr);gap:16px;margin:0;padding:16px 36px;border-top:1px solid color-mix(in oklab,var(--kino-texto-primario) 14%,transparent);background:color-mix(in oklab,#020a07 62%,transparent);backdrop-filter:blur(14px) saturate(1.2)}
.lector__datos div{display:grid;gap:4px;min-width:0}
.lector__datos--dia dd{color:var(--kino-texto-secundario)}
.lector__datos dt{font-family:var(--kino-fuente-dato);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--kino-texto-secundario)}
.lector__datos dd{margin:0;font-size:18px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lector__llamar{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-top:8px}
.lector__llamar .secundario-btn{width:auto;background:color-mix(in oklab,#020a07 40%,transparent)}
.llamando{font-weight:700;animation:latir 1.4s infinite}
.puntos{display:flex;gap:8px}
.puntos i{width:10px;height:10px;border-radius:50%;background:var(--kino-estado-por-vencer-texto);animation:latir 1.2s var(--c-latir) infinite}
.puntos i:nth-child(2){animation-delay:.15s}.puntos i:nth-child(3){animation-delay:.3s}
.lector__cuenta{display:grid;gap:8px;margin-top:12px;max-width:280px}
.lector__cuenta-pista{display:block;height:4px;border-radius:2px;background:color-mix(in oklab,var(--kino-estado-vigente-texto) 20%,transparent);overflow:hidden}
.lector__cuenta-pista span{display:block;height:100%;background:var(--kino-estado-vigente-texto);transform-origin:left}
.porteria__lateral{display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:12px;min-width:0;min-height:0}
.llegadas{display:grid;gap:8px;align-content:start;overflow-y:auto;padding-bottom:24px;scrollbar-width:none;-webkit-mask-image:linear-gradient(#000 calc(100% - 32px),transparent);mask-image:linear-gradient(#000 calc(100% - 32px),transparent)}
.llegada{display:flex;gap:12px;align-items:center;min-height:56px;text-align:left;padding:8px 12px;border-radius:12px;border:1px solid var(--kino-borde-tenue);background:var(--kino-superficie-elevada);transition:transform var(--r-tacto-ms) var(--r-tacto),border-color var(--d-corto)}
.llegada:hover{border-color:var(--kino-borde-definido)}
.llegada:active{transform:scale(.98)}
.llegada:disabled{opacity:.5}
.llegada__texto{display:grid;gap:2px;min-width:0}
.llegada__texto b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.llegada .tenue{font-size:13px}
.porteria__digitar{display:grid;gap:8px}
.teclado{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}
.teclado input{min-width:0;min-height:48px;border-radius:12px;border:1px solid var(--kino-borde-definido);background:var(--kino-superficie-base);padding:0 12px;font-size:20px}
.teclado .accion{width:auto;min-height:48px}
.bitacora{display:grid;gap:8px;min-width:0}
.bitacora__tabla{overflow:hidden;border-radius:16px;border:1px solid var(--kino-borde-tenue)}
.tabla{width:100%;border-collapse:collapse;table-layout:fixed;font-size:15px}
.tabla th{text-align:left;font-family:var(--kino-fuente-dato);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--kino-texto-tenue);font-weight:500;padding:8px 12px;background:var(--kino-superficie-base)}
.tabla td{padding:8px 12px;border-top:1px solid var(--kino-borde-tenue);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;height:44px}
.tabla td.tabla__motivo{color:var(--kino-texto-secundario);white-space:normal;line-height:1.3}
.tabla tr.nueva td{animation:resalta 2s var(--c-decaer)}
@keyframes resalta{from{background:var(--kino-superficie-membrana)}}

/* Administración ------------------------------------------------------------------------------------ */
.app--admin{flex-direction:row}
.admin__menu{width:256px;flex:none;padding:24px 16px;display:flex;flex-direction:column;gap:24px;border-right:1px solid var(--kino-borde-tenue)}
.admin__marca{display:flex;gap:12px;align-items:center;font-size:17px;padding:0 8px}
.admin__nav{display:grid;gap:4px}
.admin__item{display:flex;gap:12px;align-items:center;min-height:48px;padding:0 12px;border-radius:12px;font-size:16px;color:var(--kino-texto-secundario);text-align:left}
.admin__item.activo{background:var(--kino-superficie-membrana);color:var(--kino-texto-primario);font-weight:700}
.admin__nota{margin-top:auto;padding:0 8px}
.admin__principal{flex:1;overflow:auto;min-width:0}
.admin__pagina{padding:32px 40px;display:grid;gap:24px;align-content:start;max-width:1000px}
.admin__cabeza{display:grid;gap:8px}
.alerta-sync{display:flex;gap:16px;align-items:center;text-align:left;padding:16px 24px;border-radius:16px;background:var(--kino-estado-rechazado-fondo);border:1px solid var(--kino-estado-rechazado-borde);color:var(--kino-estado-rechazado-texto)}
.alerta-sync__texto{display:grid;gap:4px;flex:1;min-width:0}
.alerta-sync b{color:var(--kino-texto-primario);font-size:17px}
.cifras{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.cifra{display:grid;gap:8px;padding:16px 24px;border-radius:16px;background:var(--kino-superficie-elevada);border:1px solid var(--kino-borde-tenue)}
.cifra__num{font-family:var(--kino-fuente-dato);font-size:44px;line-height:1}
.admin__columnas{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}
.tabla--admin td,.tabla--admin th{padding-left:0;background:none}
.tabla--admin td:last-child{white-space:normal}
.franjas{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.franja{gap:16px;align-content:start}
.franja__cabeza{display:grid;gap:4px}
.franja__controles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.admin__guardar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:stretch}
.admin__guardar .accion{align-self:center}
.previa{display:grid;gap:4px;padding:16px 24px;border-radius:14px;border:1px solid var(--kino-estado-vigente-borde);background:var(--kino-estado-vigente-fondo)}
.previa--choca{border-color:var(--kino-estado-por-vencer-borde);background:var(--kino-estado-por-vencer-fondo)}
.sync-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.sync{display:grid;gap:16px;align-content:start;padding:24px;border-radius:16px;background:var(--kino-superficie-elevada);border:1px solid var(--kino-borde-tenue)}
.sync--caida{border-color:var(--kino-estado-rechazado-borde)}
.sync__cabeza{display:flex;justify-content:space-between;align-items:center;font-size:18px}
.sync__barra{height:8px;border-radius:4px;background:var(--kino-superficie-base);overflow:hidden}
.sync__barra i{display:block;height:100%;background:var(--kino-estado-vigente-texto);transform-origin:left;transition:transform .1s linear}
.causa{margin:0;font-size:15px;color:var(--kino-texto-secundario)}
.red{width:100%;height:auto;overflow:visible}
.red__cauce{stroke:var(--kino-borde-tenue)!important;stroke-width:12!important;stroke-dasharray:none!important;opacity:.35}
.red__alta{fill:#d8fff0;filter:drop-shadow(0 0 4px var(--kino-biolum-d110))}
.red--flujo .red__nodo{stroke:var(--kino-estado-vigente-borde)}
.red__tubo path{fill:none;stroke:var(--kino-estado-vigente-texto);stroke-linecap:round;transition:stroke-width var(--d-crecer) var(--c-crecer),stroke var(--d-corto)}
.red__tubo--parcial path{stroke:var(--kino-estado-por-vencer-texto)}
.red__tubo--seco path{stroke:var(--kino-estado-rechazado-texto);stroke-dasharray:2 6}
.red__tubo text{font-family:var(--kino-fuente-dato);font-size:12px;fill:var(--kino-texto-secundario)}
.red__nodo{fill:url(#red-nodo);stroke:var(--kino-borde-definido);stroke-width:1.5}
.red__rotulo{font-family:var(--kino-fuente-dato);font-size:12px;fill:var(--kino-texto-primario)}
.red__rotulo--tenue{fill:var(--kino-texto-secundario)}

/* Dirección biopunk (E3-1, aprobada). Movimiento según entrega-3/motion-e-ilustracion.md: nada se mueve si no cambia un dato. */
:root{--bio-filamento:#00D595;--bio-quitina:conic-gradient(from var(--giro,0deg),var(--kino-biolum-d110),var(--kino-indigo-d110),var(--kino-violeta-d110),var(--kino-biolum-d70),var(--kino-biolum-d110))}
@property --giro{syntax:'<angle>';inherits:false;initial-value:0deg}
[data-bio="1"] .titulo--xl,[data-bio="1"] .titulo--l{font-stretch:125%}
[data-bio="1"] .micelio--cabecera{opacity:.7}
[data-bio="1"] .tarjeta{border-radius:24px 18px 26px 16px}
[data-bio="1"] .tarjeta .membrana{display:block;position:absolute;inset:-30%;z-index:-1;background:radial-gradient(40% 50% at 30% 40%,color-mix(in oklab,var(--kino-biolum-d45) 50%,transparent),transparent 70%);opacity:calc(.55 * var(--brillo,1))}
[data-bio="1"] .tarjeta--vigente{box-shadow:inset 3px 0 0 var(--kino-estado-vigente-texto),-12px 0 32px -18px var(--kino-biolum-d110),var(--kino-relieve-membrana)}
/* Por vencer: la bioluminiscencia se fatiga; el brillo baja con el tiempo que queda. */
[data-bio="1"] .tarjeta--por-vencer{box-shadow:inset 3px 0 0 color-mix(in oklab,var(--kino-estado-por-vencer-texto) calc(var(--brillo,1) * 100%),transparent),-12px 0 30px -18px color-mix(in oklab,var(--kino-ambar-d110) calc(var(--brillo,1) * 100%),transparent),var(--kino-relieve-membrana)}
[data-bio="1"] .tarjeta--vencido{border-radius:30px 12px 34px 10px;filter:saturate(.25) sepia(.3) brightness(.9);transform:scale(.985)}
[data-bio="1"] .tarjeta--vencido .membrana,[data-bio="1"] .tarjeta--usado .membrana,[data-bio="1"] .tarjeta--revocado .membrana{display:none}
[data-bio="1"] .corte{height:4px;background:repeating-linear-gradient(90deg,var(--kino-estado-revocado-texto) 0 10px,transparent 10px 14px);filter:drop-shadow(0 0 4px var(--kino-carmin-d110))}
[data-bio="1"] .vida{height:7px;border-radius:4px}
[data-bio="1"] .vida--vigente .vida__fluido,[data-bio="1"] .vida--por-vencer .vida__fluido{background:linear-gradient(90deg,var(--kino-biolum-d45),var(--kino-estado-vigente-texto),var(--kino-biolum-d45)) 0 0/60px 100%;border-radius:4px;box-shadow:0 0 10px var(--kino-biolum-d110)}
[data-bio="1"] .vida--por-vencer .vida__fluido{background:linear-gradient(90deg,var(--kino-ambar-d110),var(--kino-estado-por-vencer-texto),var(--kino-ambar-d110)) 0 0/60px 100%}
[data-bio="1"] .portal__arco{box-shadow:none}
[data-bio="1"] .portal--vigente .portal__arco::before,[data-bio="1"] .portal--por-vencer .portal__arco::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:4px;background:var(--bio-quitina);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;opacity:var(--brillo,1)}
[data-bio="1"] .portal--vigente .portal__halo{background:radial-gradient(closest-side,color-mix(in oklab,var(--kino-biolum-d110) 60%,transparent),color-mix(in oklab,var(--kino-violeta-d45) 30%,transparent) 60%,transparent)}
[data-bio="1"] .portal--vencido .portal__arco{border-radius:44% 56% 20px 12px / 40% 50% 20px 12px;filter:saturate(0) contrast(.8)}
[data-bio="1"] .accion--crear{background:radial-gradient(120% 140% at 30% 0%,#3dffb8,#00D595 50%,#00a874);box-shadow:0 0 0 1px #00ffaa55,0 10px 30px -10px #00D595}
[data-bio="1"] .accion--crear[aria-disabled="true"]{background:var(--kino-superficie-membrana);box-shadow:none}
[data-bio="1"] .iniciales{border-radius:48% 52% 45% 55%/55% 45% 55% 45%}

/* Movimiento reducido ------------------------------------------------------------------------------- */
/* Reducido no es apagado: lo que aparece se funde en 240 ms o menos; lo que late o barre se queda quieto;
   las transiciones de color siguen, las de forma no. Las animaciones WAAPI se adaptan en movimiento.ts. */
@keyframes fundido{from{opacity:0}}
@media (prefers-reduced-motion:reduce){
	.entra,.nota-interaccion,.traza__item,.burbuja,.fila-aviso,.notificacion,.banner,.deshacer,.tabla tr.nueva td,.tarjeta--nueva{animation:fundido var(--d-corto) linear both!important}
	.tarjeta--nueva .vida,.puntos i,.llamando{animation:none!important}
	*,*::before,*::after{transition-property:color,background-color,border-color,opacity,box-shadow!important}
}
[data-reducido="1"] :is(.entra,.nota-interaccion,.traza__item,.burbuja,.fila-aviso,.notificacion,.banner,.deshacer,.tabla tr.nueva td,.tarjeta--nueva){animation:fundido var(--d-corto) linear both!important}
[data-reducido="1"] :is(.tarjeta--nueva .vida,.puntos i,.llamando){animation:none!important}
[data-reducido="1"] *,[data-reducido="1"] *::before,[data-reducido="1"] *::after{transition-property:color,background-color,border-color,opacity,box-shadow!important}

/* Ilustraciones: una familia con el arco y la gota del logo; trazo 1,7 de puntas redondas, dos colores apagados. */
.ilustracion{width:148px;height:auto;justify-self:center;overflow:visible}
.ilustracion__trazo{fill:none;stroke:var(--kino-texto-secundario);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.ilustracion__trazo--tenue{stroke:var(--kino-borde-definido)}
.ilustracion__trazo--punteado{stroke-dasharray:2 6}
.ilustracion__trazo--borde{stroke:color-mix(in oklab,var(--kino-estado-vigente-borde) 55%,var(--kino-borde-definido))}
.ilustracion__brillo{fill:none;stroke:#ffffff30;stroke-width:2.4;stroke-linecap:round}
.ilustracion__gota{fill:color-mix(in oklab,var(--kino-marca-gota) 70%,var(--kino-superficie-base))}
.ilustracion__gota--tenue{fill:none;stroke:var(--kino-borde-definido);stroke-width:3.4;stroke-dasharray:4 8}

/* Pantallas pequeñas: el prototipo se usa como app a pantalla completa ------------------------------- */
@media (max-width:820px){
	.escenario{grid-template-columns:minmax(0,1fr);height:auto;min-height:100vh;overflow-x:hidden}
	.escenario__marca .tenue{display:none}
	.reloj{max-width:100%}
	.notas{grid-column:1}
	.notas{border-left:0;border-top:1px solid var(--kino-borde-tenue)}
	.escenario__cabeza{padding:12px 16px;gap:10px}
	.actores{margin:0;overflow-x:auto;flex-wrap:nowrap;max-width:100%}
	.actores button{white-space:nowrap;font-size:14px;padding:8px 12px}
	.escenario__lienzo{flex-direction:column;padding:16px;align-items:stretch}
	.puesto--telefono,.puesto--tableta,.puesto--portatil{flex:none;height:min(844px,calc(100vh - 140px))}
	.puesto--tableta,.puesto--portatil{height:auto;aspect-ratio:1080/760}
}
